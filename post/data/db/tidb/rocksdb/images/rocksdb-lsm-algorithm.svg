<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-label="RocksDB leveled LSM structure">
  <rect width="1000" height="400" fill="#f7f9fb"/>
  <text x="500" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">Leveled LSM-tree (one CF)</text>
  <text x="500" y="44" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Immutable sorted generations stacked by age; same user key may appear in several layers</text>

  <text x="80" y="78" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#546e7a">key space --&gt;</text>
  <line x1="180" y1="74" x2="920" y2="74" stroke="#90a4ae" stroke-width="1"/>
  <polygon points="920,70 932,74 920,78" fill="#90a4ae"/>

  <text x="40" y="118" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1b5e20">Mem</text>
  <rect x="180" y="98" width="740" height="36" fill="#e8f5e9" stroke="#2e7d32" rx="3"/>
  <text x="550" y="121" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1b5e20">active + immutable MemTable(s)  |  newest updates</text>

  <text x="40" y="180" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#e65100">L0</text>
  <rect x="180" y="158" width="200" height="40" fill="#fff3e0" stroke="#ef6c00" rx="3"/>
  <text x="280" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e65100">SST a  [k1..k9]</text>
  <rect x="320" y="158" width="220" height="40" fill="#ffe0b2" stroke="#ef6c00" rx="3"/>
  <text x="430" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e65100">SST b  [k3..k12]</text>
  <rect x="480" y="158" width="200" height="40" fill="#ffcc80" stroke="#ef6c00" rx="3"/>
  <text x="580" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e65100">SST c  [k8..k20]</text>
  <text x="720" y="183" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#bf360c">ranges MAY overlap</text>

  <text x="40" y="260" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#6a1b9a">L1</text>
  <rect x="180" y="238" width="160" height="40" fill="#f3e5f5" stroke="#7b1fa2" rx="3"/>
  <text x="260" y="263" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6a1b9a">[k1..k5]</text>
  <rect x="350" y="238" width="180" height="40" fill="#e1bee7" stroke="#7b1fa2" rx="3"/>
  <text x="440" y="263" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6a1b9a">[k6..k12]</text>
  <rect x="540" y="238" width="200" height="40" fill="#ce93d8" stroke="#7b1fa2" rx="3"/>
  <text x="640" y="263" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6a1b9a">[k13..k20]</text>
  <text x="760" y="263" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#4a148c">no overlap in level</text>

  <text x="40" y="340" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#4527a0">Ln</text>
  <rect x="180" y="318" width="280" height="40" fill="#ede7f6" stroke="#4527a0" rx="3"/>
  <text x="320" y="343" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4527a0">[k1..k10]  larger runs</text>
  <rect x="470" y="318" width="300" height="40" fill="#d1c4e9" stroke="#4527a0" rx="3"/>
  <text x="620" y="343" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#4527a0">[k11..k20]</text>
  <text x="790" y="343" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#311b92">~ size * multiplier</text>

  <text x="180" y="385" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Newer above older. Version / MANIFEST assigns each SST to a level.</text>
</svg>
