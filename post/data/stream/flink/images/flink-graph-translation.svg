  <line x1="334" y1="90" x2="358" y2="90" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="458" y1="90" x2="482" y2="90" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="582" y1="90" x2="606" y2="90" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="706" y1="90" x2="730" y2="90" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>

