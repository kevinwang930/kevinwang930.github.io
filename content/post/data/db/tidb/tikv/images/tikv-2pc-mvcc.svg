<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="TiKV two-phase commit and MVCC">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#f7f9fb"/>
  <text x="500" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Transactional write path (Percolator-style 2PC)</text>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Client-go twoPhaseCommitter; TiKV stores Lock then Write/Default at commit</text>

  <!-- Sequence boxes -->
  <g transform="translate(40, 80)">
    <rect width="200" height="120" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4" rx="5"/>
    <text x="100" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">1. Begin</text>
    <text x="100" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1565c0">PD TSO -&gt; startTS</text>
    <text x="100" y="76" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">mutations in MemDB</text>
    <text x="100" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">snapshot reads at startTS</text>
  </g>

  <line x1="240" y1="140" x2="288" y2="140" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr3)"/>

  <g transform="translate(290, 80)">
    <rect width="200" height="120" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.4" rx="5"/>
    <text x="100" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">2. Prewrite</text>
    <text x="100" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#ef6c00">PrewriteRequest</text>
    <text x="100" y="76" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">per-Region batches</text>
    <text x="100" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">primaryKey + secondaries</text>
  </g>

  <line x1="490" y1="140" x2="538" y2="140" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr3)"/>

  <g transform="translate(540, 80)">
    <rect width="200" height="120" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4" rx="5"/>
    <text x="100" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">3. Commit</text>
    <text x="100" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">commitTS from TSO</text>
    <text x="100" y="76" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">Commit primaryKey first</text>
    <text x="100" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">then secondary keys</text>
  </g>

  <line x1="740" y1="140" x2="788" y2="140" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr3)"/>

  <g transform="translate(790, 80)">
    <rect width="170" height="120" fill="#fce4ec" stroke="#c2185b" stroke-width="1.4" rx="5"/>
    <text x="85" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ad1457">4. Cleanup</text>
    <text x="85" y="54" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">on failure:</text>
    <text x="85" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c2185b">rollback locks</text>
    <text x="85" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">async resolve</text>
  </g>

  <!-- MVCC layout -->
  <g transform="translate(40, 240)">
    <rect width="920" height="260" fill="#ffffff" stroke="#455a64" stroke-width="1.4" rx="5"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#263238">Per-key MVCC (conceptual; unistore LockStore + Badger mirrors production CF roles)</text>

    <rect x="20" y="50" width="280" height="180" fill="#fff8e1" stroke="#f9a825" rx="4"/>
    <text x="160" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#f57f17">Lock CF / LockStore</text>
    <text x="160" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d4c41">user key -&gt; Lock</text>
    <text x="160" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#795548">StartTS, Primary, TTL, Op</text>
    <text x="160" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8d6e63">written at Prewrite</text>
    <text x="160" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8d6e63">cleared at Commit/Rollback</text>
    <text x="160" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#8d6e63">blocks conflicting writers</text>

    <rect x="320" y="50" width="280" height="180" fill="#e8f5e9" stroke="#2e7d32" rx="4"/>
    <text x="460" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1b5e20">Write CF</text>
    <text x="460" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2e7d32">user_key + commitTS</text>
    <text x="460" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#388e3c">points to startTS / type</text>
    <text x="460" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#558b2f">commit visibility marker</text>
    <text x="460" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#558b2f">readers scan by TS</text>
    <text x="460" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#558b2f">GC removes old versions</text>

    <rect x="620" y="50" width="280" height="180" fill="#e3f2fd" stroke="#1565c0" rx="4"/>
    <text x="760" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0d47a1">Default CF</text>
    <text x="760" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1565c0">user_key + startTS</text>
    <text x="760" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1976d2">row / index value bytes</text>
    <text x="760" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">payload of the mutation</text>
    <text x="760" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">short values may inline</text>
    <text x="760" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#546e7a">in Lock during prewrite</text>
  </g>
</svg>
