<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-label="TiKV Regions and Raft replicas">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect width="1000" height="480" fill="#f7f9fb"/>
  <text x="500" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Global keyspace partitioned into Regions</text>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Each Region is a left-closed, right-open key range with its own Raft group</text>

  <!-- Key continuum -->
  <g transform="translate(60, 80)">
    <rect width="880" height="56" fill="#ffffff" stroke="#455a64" stroke-width="1.4" rx="4"/>
    <text x="20" y="22" font-family="Consolas, monospace" font-size="11" fill="#37474f">byte-ordered keys</text>
    <line x1="20" y1="36" x2="860" y2="36" stroke="#90a4ae" stroke-width="2"/>
    <rect x="40" y="28" width="200" height="16" fill="#c8e6c9" stroke="#66bb6a"/>
    <rect x="240" y="28" width="260" height="16" fill="#bbdefb" stroke="#64b5f6"/>
    <rect x="500" y="28" width="180" height="16" fill="#ffe0b2" stroke="#ffb74d"/>
    <rect x="680" y="28" width="160" height="16" fill="#e1bee7" stroke="#ba68c8"/>
    <text x="140" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#2e7d32">Region A [a, m)</text>
    <text x="370" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1565c0">Region B [m, t)</text>
    <text x="590" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#ef6c00">Region C [t, z)</text>
    <text x="760" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#7b1fa2">...</text>
  </g>

  <!-- Store boxes for Region B -->
  <text x="500" y="176" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#263238">Region B peers (example RF=3)</text>

  <g transform="translate(80, 200)">
    <rect width="240" height="160" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" rx="5"/>
    <text x="120" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">TiKV Store 1</text>
    <text x="120" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#2e7d32">Peer: LEADER</text>
    <rect x="30" y="70" width="180" height="70" fill="#ffffff" stroke="#81c784" rx="4"/>
    <text x="120" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">serves reads/writes</text>
    <text x="120" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">Raft log + MVCC apply</text>
  </g>

  <g transform="translate(380, 200)">
    <rect width="240" height="160" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="5"/>
    <text x="120" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">TiKV Store 2</text>
    <text x="120" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#546e7a">Peer: FOLLOWER</text>
    <rect x="30" y="70" width="180" height="70" fill="#eceff1" stroke="#b0bec5" rx="4"/>
    <text x="120" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">replicates Raft log</text>
    <text x="120" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">may serve follower read</text>
  </g>

  <g transform="translate(680, 200)">
    <rect width="240" height="160" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="5"/>
    <text x="120" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">TiKV Store 3</text>
    <text x="120" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#546e7a">Peer: FOLLOWER</text>
    <rect x="30" y="70" width="180" height="70" fill="#eceff1" stroke="#b0bec5" rx="4"/>
    <text x="120" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">replicates Raft log</text>
    <text x="120" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">majority for commit</text>
  </g>

  <line x1="320" y1="280" x2="380" y2="280" stroke="#37474f" stroke-width="1.2" marker-end="url(#arr2)"/>
  <line x1="620" y1="280" x2="680" y2="280" stroke="#37474f" stroke-width="1.2" marker-end="url(#arr2)"/>

  <text x="500" y="410" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">PD schedules Region placement; clients cache Region -&gt; leader via RegionCache</text>
  <text x="500" y="434" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">Split / merge adjust range boundaries; epoch bumps invalidate stale cache entries</text>
  <text x="500" y="458" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">Not shown: TiFlash learner peers attached to the same Region key range</text>
</svg>
