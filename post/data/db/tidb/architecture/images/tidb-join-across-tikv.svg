<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-label="TiDB join: TableReader splits ranges into parallel Region cop RPCs">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1565c0"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#6a1b9a"/>
    </marker>
  </defs>

  <rect width="1100" height="640" fill="#f7f9fb"/>
  <text x="550" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Join across TiKV ranges: parallel Region split and Coprocessor RPC</text>
  <text x="550" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Join runs on TiDB; each TableReader fans one logical scan into concurrent copTasks (default tidb_distsql_scan_concurrency=15)</text>

  <!-- HashJoin -->
  <g transform="translate(340, 62)">
    <rect width="420" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" rx="6"/>
    <text x="210" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d47a1">TiDB HashJoin / MergeJoin (RootTask)</text>
    <text x="210" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1565c0">Next(chunk) pulls both children; join in TiDB memory</text>
  </g>

  <!-- Left TableReader pipeline -->
  <g transform="translate(40, 160)">
    <rect width="480" height="250" fill="#fffde7" stroke="#f9a825" stroke-width="1.5" rx="6"/>
    <text x="240" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">Left TableReaderExecutor (orders)</text>

    <rect x="20" y="40" width="200" height="48" fill="#fff8e1" stroke="#ff8f00" stroke-width="1.2" rx="4"/>
    <text x="120" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#5d4037">1. ranger -&gt; kv.KeyRange</text>
    <text x="120" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#8d6e63">[t100_r1, +inf)</text>

    <line x1="220" y1="64" x2="250" y2="64" stroke="#ef6c00" stroke-width="1.4" marker-end="url(#arrO)"/>

    <rect x="250" y="40" width="210" height="48" fill="#f3e5f5" stroke="#8e24aa" stroke-width="1.2" rx="4"/>
    <text x="355" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#4a148c">2. SplitKeyRangesByLocations</text>
    <text x="355" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#7b1fa2">RegionCache / BatchLocate</text>

    <line x1="355" y1="88" x2="355" y2="112" stroke="#6a1b9a" stroke-width="1.4" marker-end="url(#arrP)"/>

    <rect x="20" y="115" width="440" height="55" fill="#fce4ec" stroke="#c2185b" stroke-width="1.2" rx="4"/>
    <text x="240" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#880e4f">3. buildCopTasks -&gt; one copTask per Region (or bucket)</text>
    <text x="240" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#ad1457">copTask{region, ranges, storeAddr}  |  |  |</text>

    <line x1="120" y1="170" x2="120" y2="195" stroke="#c2185b" stroke-width="1.3" marker-end="url(#arrO)"/>
    <line x1="240" y1="170" x2="240" y2="195" stroke="#c2185b" stroke-width="1.3" marker-end="url(#arrO)"/>
    <line x1="360" y1="170" x2="360" y2="195" stroke="#c2185b" stroke-width="1.3" marker-end="url(#arrO)"/>

    <rect x="40" y="198" width="100" height="36" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.1" rx="3"/>
    <text x="90" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1a237e">worker RPC</text>
    <rect x="190" y="198" width="100" height="36" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.1" rx="3"/>
    <text x="240" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1a237e">worker RPC</text>
    <rect x="310" y="198" width="100" height="36" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.1" rx="3"/>
    <text x="360" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1a237e">worker RPC</text>
  </g>

  <!-- Right TableReader compact -->
  <g transform="translate(560, 160)">
    <rect width="500" height="250" fill="#fffde7" stroke="#f9a825" stroke-width="1.5" rx="6"/>
    <text x="250" y="24" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">Right TableReaderExecutor (items)</text>
    <text x="250" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6d4c41">Same pipeline: KeyRange -&gt; locate -&gt; copTasks -&gt; parallel Cop RPC</text>
    <text x="250" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#8d6e63">distsql.Select -&gt; CopClient.Send(concurrency)</text>

    <rect x="40" y="100" width="120" height="50" fill="#fce4ec" stroke="#c2185b" stroke-width="1.1" rx="3"/>
    <text x="100" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#880e4f">copTask R3</text>
    <rect x="190" y="100" width="120" height="50" fill="#fce4ec" stroke="#c2185b" stroke-width="1.1" rx="3"/>
    <text x="250" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#880e4f">copTask R4</text>
    <rect x="340" y="100" width="120" height="50" fill="#fce4ec" stroke="#c2185b" stroke-width="1.1" rx="3"/>
    <text x="400" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#880e4f">copTask ...</text>

    <line x1="100" y1="150" x2="100" y2="195" stroke="#c2185b" stroke-width="1.3" marker-end="url(#arrO)"/>
    <line x1="250" y1="150" x2="250" y2="195" stroke="#c2185b" stroke-width="1.3" marker-end="url(#arrO)"/>
    <line x1="400" y1="150" x2="400" y2="195" stroke="#c2185b" stroke-width="1.3" marker-end="url(#arrO)"/>

    <rect x="50" y="198" width="100" height="36" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.1" rx="3"/>
    <text x="100" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1a237e">worker RPC</text>
    <rect x="200" y="198" width="100" height="36" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.1" rx="3"/>
    <text x="250" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1a237e">worker RPC</text>
    <rect x="350" y="198" width="100" height="36" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.1" rx="3"/>
    <text x="400" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1a237e">worker RPC</text>
  </g>

  <line x1="450" y1="132" x2="280" y2="160" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>
  <line x1="650" y1="132" x2="810" y2="160" stroke="#1565c0" stroke-width="1.5" marker-end="url(#arrB)"/>

  <!-- TiKV nodes -->
  <g transform="translate(30, 450)">
    <rect width="180" height="85" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4" rx="5"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">TiKV store A</text>
    <text x="90" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">R1 leader orders</text>
    <text x="90" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#78909c">Coprocessor RPC</text>
  </g>
  <g transform="translate(240, 450)">
    <rect width="180" height="85" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4" rx="5"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">TiKV store B</text>
    <text x="90" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">R2 leader orders</text>
    <text x="90" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#78909c">Coprocessor RPC</text>
  </g>
  <g transform="translate(580, 450)">
    <rect width="180" height="85" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4" rx="5"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">TiKV store C</text>
    <text x="90" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">R3 leader items</text>
    <text x="90" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#78909c">Coprocessor RPC</text>
  </g>
  <g transform="translate(820, 450)">
    <rect width="180" height="85" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.4" rx="5"/>
    <text x="90" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">TiKV store D</text>
    <text x="90" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">R4 leader items</text>
    <text x="90" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#78909c">Coprocessor RPC</text>
  </g>

  <line x1="160" y1="410" x2="120" y2="450" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#arrG)"/>
  <line x1="280" y1="410" x2="330" y2="450" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#arrG)"/>
  <line x1="660" y1="410" x2="670" y2="450" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#arrG)"/>
  <line x1="860" y1="410" x2="910" y2="450" stroke="#2e7d32" stroke-width="1.4" marker-end="url(#arrG)"/>

  <text x="550" y="570" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">Workers run up to min(DistSQLScanConcurrency, numTasks) RPCs in parallel; responses merge into TableReader.Next chunks</text>
  <text x="550" y="592" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">IndexJoin: outer reader same fan-out; inner keys BatchLocate then batched Get/Cop to whichever leaders hold those keys</text>
  <text x="550" y="614" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#90a4ae">Optional TiFlash MPP hash join shuffles among TiFlash nodes (not TiKV Raft peers)</text>
</svg>
