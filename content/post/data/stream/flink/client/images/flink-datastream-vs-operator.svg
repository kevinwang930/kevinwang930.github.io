<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="DataStream API handles versus StreamOperator runtime">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="920" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="460" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">DataStream vs StreamOperator</text>
  <text x="460" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">orders-per-minute: API handle now, runtime operator later</text>

  <!-- Left: DataStream API -->
  <rect x="24" y="68" width="420" height="280" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="234" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#7c3aed">DataStream (API)</text>
  <text x="234" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">build time / client</text>

  <rect x="48" y="132" width="160" height="56" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="128" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">DataStreamSource</text>
  <text x="128" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">orders</text>

  <rect x="248" y="132" width="160" height="56" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="328" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">SingleOutput...</text>
  <text x="328" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">ParseOrder map</text>

  <line x1="208" y1="160" x2="248" y2="160" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>

  <rect x="48" y="208" width="160" height="56" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="128" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">KeyedStream</text>
  <text x="128" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">keyBy(userId)</text>

  <rect x="248" y="208" width="160" height="56" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.3"/>
  <text x="328" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">WindowedStream</text>
  <text x="328" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">window(1 min)</text>

  <line x1="128" y1="188" x2="128" y2="208" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>
  <line x1="208" y1="236" x2="248" y2="236" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#arrp)"/>

  <rect x="148" y="284" width="172" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="234" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0f172a">each wraps a</text>
  <text x="234" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#7c3aed">Transformation</text>

  <!-- Arrow API to runtime -->
  <line x1="444" y1="200" x2="496" y2="200" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="470" y="188" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#475569">execute</text>

  <!-- Right: StreamOperator runtime -->
  <rect x="500" y="68" width="396" height="280" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="698" y="94" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#2563eb">StreamOperator (runtime)</text>
  <text x="698" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">inside StreamTask / slot</text>

  <rect x="528" y="132" width="150" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="603" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">SourceOperator</text>
  <text x="603" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">orders reader</text>

  <rect x="710" y="132" width="150" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="785" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamMap</text>
  <text x="785" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">ParseOrder</text>

  <line x1="678" y1="160" x2="710" y2="160" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>

  <rect x="528" y="208" width="150" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="603" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">WindowOperator</text>
  <text x="603" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">CountPerUser</text>

  <rect x="710" y="208" width="150" height="56" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.3"/>
  <text x="785" y="232" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamSink</text>
  <text x="785" y="250" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">kafkaSink</text>

  <line x1="603" y1="188" x2="603" y2="208" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <line x1="678" y1="236" x2="710" y2="236" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>

  <rect x="560" y="284" width="260" height="44" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="690" y="302" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0f172a">created by operatorFactory</text>
  <text x="690" y="318" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2563eb">processElement / open / close</text>

  <!-- Bottom summary -->
  <rect x="24" y="368" width="872" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="460" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#475569">DataStream = client-side graph handle  |  StreamOperator = worker-side record processor</text>
</svg>
