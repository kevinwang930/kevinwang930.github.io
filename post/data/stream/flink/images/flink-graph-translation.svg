<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-label="orders-per-minute job graph translation from API to StreamTasks">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrp" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#8b5cf6"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arro" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ea580c"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
  </defs>

  <rect width="980" height="560" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="490" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Job graph translation</text>
  <text x="490" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">example: orders-per-minute</text>

  <!-- ========== 1 API ========== -->
  <text x="24" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#7c3aed">1 API</text>

  <rect x="110" y="64" width="100" height="52" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="160" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">orders</text>
  <text x="160" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">fromSource</text>

  <rect x="234" y="64" width="100" height="52" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="284" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">ParseOrder</text>
  <text x="284" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">map</text>

  <rect x="358" y="64" width="100" height="52" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="408" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">keyBy</text>
  <text x="408" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">userId</text>

  <rect x="482" y="64" width="100" height="52" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="532" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">window</text>
  <text x="532" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">1 min</text>

  <rect x="606" y="64" width="100" height="52" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="656" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">aggregate</text>
  <text x="656" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">CountPerUser</text>

  <rect x="730" y="64" width="100" height="52" rx="6" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.4"/>
  <text x="780" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">kafkaSink</text>
  <text x="780" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#64748b">sinkTo</text>

