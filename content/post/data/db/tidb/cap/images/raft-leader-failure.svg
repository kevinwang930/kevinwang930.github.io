<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-label="Raft leader failure detection and re-election">
  <defs>
    <marker id="arrRd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#c62828"/>
    </marker>
    <marker id="arrOr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrGn2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrBl2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1565c0"/>
    </marker>
  </defs>

  <rect width="1000" height="620" fill="#f7f9fb"/>
  <text x="500" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Leader failure and recovery</text>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Missed heartbeats trigger election; new leader resumes; clients redirect via NotLeader</text>

  <!-- Phase labels -->
  <text x="180" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#c62828">t0  Leader fails</text>
  <text x="500" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#ef6c00">t1  Detect + elect</text>
  <text x="820" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2e7d32">t2  New leader</text>

  <!-- ===== Column 1: failure ===== -->
  <g transform="translate(40, 100)">
    <rect width="280" height="280" fill="#ffebee" stroke="#e57373" stroke-width="1.6" rx="6"/>
    <text x="140" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b71c1c">Before / crash</text>

    <rect x="40" y="50" width="200" height="70" fill="#ffcdd2" stroke="#c62828" stroke-width="1.6" rx="4" stroke-dasharray="5 3"/>
    <text x="140" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c62828">LEADER A  DOWN</text>
    <text x="140" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c62828">heartbeats stop</text>

    <rect x="20" y="140" width="110" height="60" fill="#ffffff" stroke="#90a4ae" rx="4"/>
    <text x="75" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">Follower B</text>
    <text x="75" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#78909c">waiting...</text>

    <rect x="150" y="140" width="110" height="60" fill="#ffffff" stroke="#90a4ae" rx="4"/>
    <text x="205" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">Follower C</text>
    <text x="205" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#78909c">waiting...</text>

    <text x="140" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c62828">election timers running</text>
    <text x="140" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">randomized per peer</text>
    <text x="140" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">uncommitted tip may be lost</text>
  </g>

  <!-- ===== Column 2: election ===== -->
  <g transform="translate(360, 100)">
    <rect width="280" height="280" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6" rx="6"/>
    <text x="140" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">Detection</text>

    <rect x="30" y="50" width="220" height="90" fill="#ffffff" stroke="#f9a825" rx="4"/>
    <text x="140" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">B election timeout fires first</text>
    <text x="140" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ef6c00">Follower -&gt; Candidate</text>
    <text x="140" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6d4c41">term++ ; RequestVote</text>

    <rect x="30" y="160" width="220" height="90" fill="#ffffff" stroke="#ffcc80" rx="4"/>
    <text x="140" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">C grants vote (majority)</text>
    <text x="140" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#2e7d32">B becomes Leader</text>
    <text x="140" y="232" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">A is unreachable / ignored</text>
  </g>

  <!-- ===== Column 3: new leader ===== -->
  <g transform="translate(680, 100)">
    <rect width="280" height="280" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.6" rx="6"/>
    <text x="140" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">After</text>

    <rect x="40" y="50" width="200" height="70" fill="#c8e6c9" stroke="#2e7d32" stroke-width="1.6" rx="4"/>
    <text x="140" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">LEADER B</text>
    <text x="140" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">AppendEntries heartbeat</text>

    <rect x="20" y="140" width="110" height="60" fill="#ffffff" stroke="#66bb6a" rx="4"/>
    <text x="75" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">Follower C</text>
    <text x="75" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#2e7d32">replicating</text>

    <rect x="150" y="140" width="110" height="60" fill="#ffcdd2" stroke="#e57373" rx="4" stroke-dasharray="4 2"/>
    <text x="205" y="165" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#c62828">A (dead)</text>
    <text x="205" y="185" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#c62828">out of quorum</text>

    <text x="140" y="230" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1b5e20">commits resume (2/3)</text>
    <text x="140" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">committed prefix preserved</text>
    <text x="140" y="274" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">only majority-durable entries</text>
  </g>

  <!-- Flow arrows between columns -->
  <line x1="320" y1="240" x2="360" y2="240" stroke="#c62828" stroke-width="1.6" marker-end="url(#arrRd)"/>
  <line x1="640" y1="240" x2="680" y2="240" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arrGn2)"/>

  <!-- Client row -->
  <g transform="translate(40, 410)">
    <rect width="920" height="180" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2" rx="6"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">Client / TiDB during failover</text>

    <rect x="20" y="50" width="270" height="100" fill="#e3f2fd" stroke="#1565c0" rx="4"/>
    <text x="155" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1565c0">1. RPC to old leader A</text>
    <text x="155" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">timeout / connection error</text>
    <text x="155" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">or NotLeader from stale peer</text>

    <line x1="290" y1="100" x2="330" y2="100" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arrBl2)"/>

    <rect x="330" y="50" width="270" height="100" fill="#fff8e1" stroke="#f9a825" rx="4"/>
    <text x="465" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ef6c00">2. During election</text>
    <text x="465" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">NotLeader (leader=nil)</text>
    <text x="465" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">invalidate RegionCache; backoff</text>

    <line x1="600" y1="100" x2="640" y2="100" stroke="#1565c0" stroke-width="1.4" marker-end="url(#arrBl2)"/>

    <rect x="640" y="50" width="260" height="100" fill="#e8f5e9" stroke="#2e7d32" rx="4"/>
    <text x="770" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#2e7d32">3. Retry to Leader B</text>
    <text x="770" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">UpdateLeader / reload PD</text>
    <text x="770" y="122" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">writes resume on new leader</text>

    <text x="20" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">CP behavior: no peer accepts a divergent write while there is no majority leader. Availability pauses until a new quorum elects.</text>
  </g>
</svg>
