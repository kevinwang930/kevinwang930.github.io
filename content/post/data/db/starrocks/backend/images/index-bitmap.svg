<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-label="Bitmap index storage for shipmode column">
  <rect width="960" height="400" fill="#f7f9fb"/>
  <text x="480" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">Bitmap index: value -&gt; roaring rowids (in segment)</text>
  <text x="480" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Example: INDEX ON lo_shipmode USING BITMAP; shared-nothing embeds in .dat</text>

  <rect x="40" y="68" width="420" height="280" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" rx="5"/>
  <rect x="40" y="68" width="420" height="28" fill="#1565c0" rx="5"/>
  <text x="250" y="87" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">On disk (shared-nothing)</text>
  <text x="56" y="120" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">.../schema_hash/rs020a_0.dat</text>
  <text x="56" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">footer / column index pages:</text>
  <text x="56" y="176" font-family="Consolas, monospace" font-size="11" fill="#37474f">BitmapIndex meta + dict</text>
  <rect x="56" y="196" width="388" height="120" fill="#e3f2fd" stroke="#1565c0" rx="3"/>
  <text x="72" y="220" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">"AIR"  -&gt; roaring {0,5,12,...}</text>
  <text x="72" y="244" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">"MAIL" -&gt; roaring {2,3,9,15}</text>
  <text x="72" y="268" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">"SHIP" -&gt; roaring {1,7,8,...}</text>
  <text x="72" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#607d8b">lake may instead use standalone .idx (IDG)</text>

  <rect x="500" y="68" width="420" height="280" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.5" rx="5"/>
  <rect x="500" y="68" width="420" height="28" fill="#6a1b9a" rx="5"/>
  <text x="710" y="87" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Query</text>
  <text x="520" y="140" font-family="Consolas, monospace" font-size="12" fill="#4a148c">WHERE lo_shipmode = 'MAIL'</text>
  <text x="520" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7b1fa2">lookup bitmap for MAIL</text>
  <text x="520" y="208" font-family="Consolas, monospace" font-size="12" fill="#4a148c">rowids = {2,3,9,15}</text>
  <text x="520" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#7b1fa2">_scan_range &amp;= roaring</text>
  <text x="520" y="288" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">exact / semi-exact prefilter</text>
</svg>
