<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-label="LSM read path and read amplification">
  <rect width="1000" height="540" fill="#f7f9fb"/>
  <text x="500" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">Read performance: point Get (one CF)</text>
  <text x="500" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Newest first; each layer may add I/O until the key is found</text>

  <!-- B-tree comparison left -->
  <g transform="translate(30,70)">
    <rect width="300" height="430" fill="#ffffff" stroke="#c62828" stroke-width="1.5" rx="6"/>
    <text x="150" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#b71c1c">B-tree Get (reference)</text>
    <text x="150" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e53935">typically 1 root + 1-2 leaf pages</text>
    <rect x="110" y="70" width="80" height="32" fill="#eceff1" stroke="#90a4ae" rx="3"/>
    <text x="150" y="91" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">root</text>
    <line x1="150" y1="102" x2="150" y2="120" stroke="#37474f"/>
    <rect x="110" y="120" width="80" height="32" fill="#ffcdd2" stroke="#c62828" rx="3"/>
    <text x="150" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#b71c1c">leaf</text>
    <text x="150" y="175" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#b71c1c">~1-3 random reads</text>
    <text x="150" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#78909c">stable as tree grows</text>
    <rect x="24" y="220" width="252" height="190" fill="#fff5f5" stroke="#ef9a9a" rx="4"/>
    <text x="40" y="248" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#b71c1c">Latency driver</text>
    <text x="40" y="272" font-family="Consolas, monospace" font-size="10" fill="#37474f">tree depth x page read</text>
    <text x="40" y="294" font-family="Consolas, monospace" font-size="10" fill="#37474f">no multi-generation merge</text>
    <text x="40" y="316" font-family="Consolas, monospace" font-size="10" fill="#37474f">write RMW on Put path</text>
  </g>

  <!-- LSM read path right -->
  <g transform="translate(360,70)">
    <rect width="610" height="430" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" rx="6"/>
    <text x="305" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d47a1">LSM Get (RocksDB)</text>
    <text x="305" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1976d2">search mem, imm, L0..Ln; pick newest seq</text>

    <rect x="24" y="68" width="562" height="36" fill="#e8f5e9" stroke="#2e7d32" rx="3"/>
    <text x="40" y="91" font-family="Consolas, monospace" font-size="11" fill="#1b5e20">1. mem_</text>
    <text x="120" y="91" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">RAM skiplist - ~0 disk</text>
    <text x="480" y="91" font-family="Consolas, monospace" font-size="10" fill="#558b2f">+0 I/O</text>

    <rect x="24" y="112" width="562" height="36" fill="#e8f5e9" stroke="#2e7d32" rx="3"/>
    <text x="40" y="135" font-family="Consolas, monospace" font-size="11" fill="#1b5e20">2. imm_</text>
    <text x="120" y="135" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">0..N flushing MemTables - RAM</text>
    <text x="480" y="135" font-family="Consolas, monospace" font-size="10" fill="#558b2f">+0 I/O</text>

    <rect x="24" y="156" width="562" height="52" fill="#fff3e0" stroke="#ef6c00" rx="3"/>
    <text x="40" y="178" font-family="Consolas, monospace" font-size="11" fill="#e65100">3. L0</text>
    <text x="120" y="178" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">scan overlapping SSTs (bloom may skip)</text>
    <text x="120" y="196" font-family="Consolas, monospace" font-size="10" fill="#bf360c">worst: all L0 files (~tens)</text>
    <text x="480" y="186" font-family="Consolas, monospace" font-size="10" fill="#ef6c00">+0..N I/O</text>

    <rect x="24" y="216" width="562" height="36" fill="#e3f2fd" stroke="#1565c0" rx="3"/>
    <text x="40" y="239" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">4. L1</text>
    <text x="120" y="239" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">binary search file index, 1 candidate SST</text>
    <text x="480" y="239" font-family="Consolas, monospace" font-size="10" fill="#1565c0">+0-1 I/O</text>

    <rect x="24" y="260" width="562" height="36" fill="#e3f2fd" stroke="#1565c0" rx="3"/>
    <text x="40" y="283" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">5. L2..Ln</text>
    <text x="120" y="283" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">at most 1 SST per level (leveled)</text>
    <text x="480" y="283" font-family="Consolas, monospace" font-size="10" fill="#1565c0">+(levels) I/O</text>

    <rect x="24" y="310" width="562" height="100" fill="#f1f8e9" stroke="#aed581" rx="4"/>
    <text x="40" y="334" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#33691e">Typical leveled point Get</text>
    <text x="40" y="358" font-family="Consolas, monospace" font-size="10" fill="#37474f">~5-15 I/Os if cache cold (mem hit: 0)</text>
    <text x="40" y="380" font-family="Consolas, monospace" font-size="10" fill="#37474f">bloom + block cache often reduce to 1-3</text>
    <text x="40" y="402" font-family="Consolas, monospace" font-size="10" fill="#37474f">L0 file count is the main tail latency knob</text>
  </g>
</svg>
