<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="Lucene segment: multiple index types">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style type="text/css"><![CDATA[
    text { font-family: system-ui, sans-serif; }
    .t { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 10px; fill: #64748b; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 9px; fill: #334155; }
    .h { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .lt { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .seg { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .a { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.25; }
    .b { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.25; }
    .c { fill: #fef3c7; stroke: #d97706; stroke-width: 1.25; }
    .d { fill: #fce7f3; stroke: #db2777; stroke-width: 1.25; }
    .e { fill: #e0e7ff; stroke: #6366f1; stroke-width: 1.25; }
  ]]></style>

  <rect width="920" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="28" class="t">One Lucene segment = several index types</text>
  <text x="28" y="46" class="s">Same docIDs; different on-disk structures. Codec opens each via SegmentCoreReaders. Field options choose which types a value enters.</text>

  <rect x="24" y="62" width="872" height="40" rx="6" class="seg" filter="url(#sh)"/>
  <text x="40" y="88" class="h">SegmentCommitInfo / SegmentReader (docID 0 .. maxDoc-1)</text>

  <rect x="24" y="120" width="210" height="88" rx="6" class="a" filter="url(#sh)"/>
  <text x="36" y="144" class="lt" fill="#2563eb">1. Inverted</text>
  <text x="36" y="164" class="m">terms dict + postings</text>
  <text x="36" y="180" class="m">TermQuery, PhraseQuery</text>
  <text x="36" y="196" class="m">Prefix / Wildcard / Fuzzy</text>

  <rect x="246" y="120" width="210" height="88" rx="6" class="b" filter="url(#sh)"/>
  <text x="258" y="144" class="lt" fill="#059669">2. Points (BKD)</text>
  <text x="258" y="164" class="m">numeric / geo / n-D</text>
  <text x="258" y="180" class="m">PointRangeQuery</text>
  <text x="258" y="196" class="m">dates as epoch long</text>

  <rect x="468" y="120" width="210" height="88" rx="6" class="c" filter="url(#sh)"/>
  <text x="480" y="144" class="lt" fill="#b45309">3. Doc values</text>
  <text x="480" y="164" class="m">columnar per doc</text>
  <text x="480" y="180" class="m">sort, agg, slow range</text>
  <text x="480" y="196" class="m">IndexOrDocValuesQuery</text>

  <rect x="690" y="120" width="206" height="88" rx="6" class="d" filter="url(#sh)"/>
  <text x="702" y="144" class="lt" fill="#be185d">4. Stored fields</text>
  <text x="702" y="164" class="m">retrieve _source-like</text>
  <text x="702" y="180" class="m">not for matching</text>
  <text x="702" y="196" class="m">storedFields()</text>

  <rect x="24" y="224" width="210" height="88" rx="6" class="e" filter="url(#sh)"/>
  <text x="36" y="248" class="lt" fill="#4338ca">5. Norms</text>
  <text x="36" y="268" class="m">per-field length/boost</text>
  <text x="36" y="284" class="m">BM25 / similarity</text>
  <text x="36" y="300" class="m">getNormValues</text>

  <rect x="246" y="224" width="210" height="88" rx="6" class="a" filter="url(#sh)"/>
  <text x="258" y="248" class="lt" fill="#2563eb">6. Term vectors</text>
  <text x="258" y="268" class="m">optional per-doc terms</text>
  <text x="258" y="284" class="m">highlight / more-like</text>
  <text x="258" y="300" class="m">termVectors()</text>

  <rect x="468" y="224" width="210" height="88" rx="6" class="b" filter="url(#sh)"/>
  <text x="480" y="248" class="lt" fill="#059669">7. Live docs</text>
  <text x="480" y="268" class="m">delete bitset (.liv)</text>
  <text x="480" y="284" class="m">delGen on commit info</text>
  <text x="480" y="300" class="m">getLiveDocs()</text>

  <rect x="690" y="224" width="206" height="88" rx="6" class="c" filter="url(#sh)"/>
  <text x="702" y="248" class="lt" fill="#b45309">8. KNN vectors</text>
  <text x="702" y="268" class="m">HNSW / quantized</text>
  <text x="702" y="284" class="m">KnnFloatVectorQuery</text>
  <text x="702" y="300" class="m">not BKD</text>

  <rect x="24" y="332" width="872" height="68" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.25"/>
  <text x="40" y="358" class="h">Field mapping chooses types</text>
  <text x="40" y="378" class="m">Example: ES date -&gt; LongPoint (2) + SortedNumericDocValues (3) + optional stored (4). Range query hits BKD, not a separate date index.</text>
</svg>
