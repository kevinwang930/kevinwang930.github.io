<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="TiKV kvdb MVCC column families lock write default">
  <rect width="1000" height="560" fill="#f7f9fb"/>
  <text x="500" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">kvdb MVCC column families</text>
  <text x="500" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">One user key across three RocksDB CFs in Engines.kv</text>

  <!-- lock -->
  <g transform="translate(25,68)">
    <rect width="310" height="300" fill="#fff8e1" stroke="#f9a825" stroke-width="1.6" rx="5"/>
    <text x="155" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#e65100">lock</text>
    <text x="155" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">open intent</text>
    <text x="18" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">KEY</text>
    <rect x="14" y="80" width="282" height="52" fill="#ffffff" stroke="#ffcc80" rx="3"/>
    <text x="24" y="100" font-family="Consolas, monospace" font-size="11" fill="#37474f">encoded(user_key)</text>
    <text x="24" y="118" font-family="Consolas, monospace" font-size="11" fill="#78909c">(no TS suffix)</text>
    <text x="18" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">VALUE</text>
    <rect x="14" y="162" width="282" height="52" fill="#ffffff" stroke="#ffcc80" rx="3"/>
    <text x="24" y="182" font-family="Consolas, monospace" font-size="11" fill="#37474f">Lock { startTS, primary,</text>
    <text x="24" y="200" font-family="Consolas, monospace" font-size="11" fill="#37474f">  ttl, op, ... }</text>
    <text x="18" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">OPS</text>
    <text x="18" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#bf360c">Prewrite: Put</text>
    <text x="18" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#bf360c">Commit / Rollback: Delete</text>
    <text x="18" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">One lock per user key</text>
  </g>

  <!-- write -->
  <g transform="translate(345,68)">
    <rect width="310" height="300" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.6" rx="5"/>
    <text x="155" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0d47a1">write</text>
    <text x="155" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">commit versions</text>
    <text x="18" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">KEY</text>
    <rect x="14" y="80" width="282" height="52" fill="#ffffff" stroke="#90caf9" rx="3"/>
    <text x="24" y="100" font-family="Consolas, monospace" font-size="11" fill="#37474f">encoded(user_key)</text>
    <text x="24" y="118" font-family="Consolas, monospace" font-size="11" fill="#37474f">@ commitTS</text>
    <text x="18" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">VALUE</text>
    <rect x="14" y="162" width="282" height="52" fill="#ffffff" stroke="#90caf9" rx="3"/>
    <text x="24" y="182" font-family="Consolas, monospace" font-size="11" fill="#37474f">Write { startTS,</text>
    <text x="24" y="200" font-family="Consolas, monospace" font-size="11" fill="#37474f">  short_value? }</text>
    <text x="18" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">OPS</text>
    <text x="18" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1565c0">Commit: Put @commitTS</text>
    <text x="18" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1565c0">Read: max commitTS &lt;= ts</text>
    <text x="18" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">Many versions per key</text>
  </g>

  <!-- default -->
  <g transform="translate(665,68)">
    <rect width="310" height="300" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.6" rx="5"/>
    <text x="155" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#6a1b9a">default</text>
    <text x="155" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">large value blobs</text>
    <text x="18" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">KEY</text>
    <rect x="14" y="80" width="282" height="52" fill="#ffffff" stroke="#ce93d8" rx="3"/>
    <text x="24" y="100" font-family="Consolas, monospace" font-size="11" fill="#37474f">encoded(user_key)</text>
    <text x="24" y="118" font-family="Consolas, monospace" font-size="11" fill="#37474f">@ startTS</text>
    <text x="18" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">VALUE</text>
    <rect x="14" y="162" width="282" height="52" fill="#ffffff" stroke="#ce93d8" rx="3"/>
    <text x="24" y="182" font-family="Consolas, monospace" font-size="11" fill="#37474f">raw user bytes</text>
    <text x="24" y="200" font-family="Consolas, monospace" font-size="11" fill="#78909c">(if not inlined in write)</text>
    <text x="18" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" font-weight="700" fill="#78909c">OPS</text>
    <text x="18" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6a1b9a">Prewrite: Put @startTS</text>
    <text x="18" y="274" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6a1b9a">(when value is large)</text>
    <text x="18" y="296" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">Linked via Write.startTS</text>
  </g>

  <!-- example -->
  <g transform="translate(25,390)">
    <rect width="950" height="150" fill="#ffffff" stroke="#90a4ae" stroke-width="1.3" rx="5"/>
    <text x="20" y="24" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">Example: user key k, startTS=100, commitTS=120 (large value)</text>

    <text x="20" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e65100">After Prewrite</text>
    <text x="20" y="72" font-family="Consolas, monospace" font-size="11" fill="#37474f">lock[k] = Lock{startTS:100, ...}</text>
    <text x="380" y="72" font-family="Consolas, monospace" font-size="11" fill="#37474f">default[k@100] = blob</text>
    <text x="680" y="72" font-family="Consolas, monospace" font-size="11" fill="#78909c">write: (empty)</text>

    <text x="20" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0d47a1">After Commit</text>
    <text x="20" y="120" font-family="Consolas, monospace" font-size="11" fill="#37474f">lock[k] deleted</text>
    <text x="380" y="120" font-family="Consolas, monospace" font-size="11" fill="#37474f">default[k@100] kept</text>
    <text x="680" y="120" font-family="Consolas, monospace" font-size="11" fill="#37474f">write[k@120] = Write{100}</text>

    <text x="20" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">Read ts=110: lock visible (wait/resolve).  Read ts=130: write[k@120] then default[k@100].</text>
  </g>
</svg>
