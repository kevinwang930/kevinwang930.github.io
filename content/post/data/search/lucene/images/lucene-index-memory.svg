<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-label="Lucene in-memory reader graph vs mmap files">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style type="text/css"><![CDATA[
    text { font-family: system-ui, sans-serif; }
    .t { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 10px; fill: #64748b; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #334155; }
    .h { font-size: 11px; font-weight: 700; fill: #0f172a; }
    .lt { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .heap { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .core { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; }
    .mmap { fill: #fef3c7; stroke: #d97706; stroke-width: 1.5; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
  ]]></style>

  <rect width="920" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="28" class="t">Index in memory: reader graph + mapped files</text>
  <text x="28" y="46" class="s">Open does not copy the whole index onto the Java heap. Heap holds the reader object graph; file bytes are usually mmap'd and paged by the OS.</text>

  <rect x="24" y="62" width="430" height="280" rx="8" class="heap" filter="url(#sh)"/>
  <text x="40" y="86" class="lt" fill="#2563eb">JVM heap (objects)</text>

  <rect x="40" y="100" width="398" height="40" rx="6" class="box"/>
  <text x="52" y="126" class="h">DirectoryReader / StandardDirectoryReader</text>

  <line x1="239" y1="140" x2="239" y2="158" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="158" width="190" height="70" rx="6" class="box"/>
  <text x="52" y="180" class="h">SegmentReader _0</text>
  <text x="52" y="198" class="m">liveDocs, FieldInfos</text>
  <text x="52" y="214" class="m">DocValuesProducer</text>

  <rect x="248" y="158" width="190" height="70" rx="6" class="box"/>
  <text x="260" y="180" class="h">SegmentReader _1</text>
  <text x="260" y="198" class="m">liveDocs, FieldInfos</text>
  <text x="260" y="214" class="m">DocValuesProducer</text>

  <line x1="135" y1="228" x2="135" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="343" y1="228" x2="343" y2="246" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="40" y="246" width="398" height="80" rx="6" class="core"/>
  <text x="52" y="270" class="h">SegmentCoreReaders (shared across NRT reopens)</text>
  <text x="52" y="290" class="m">FieldsProducer | PointsReader | Norms | Stored | Knn | ...</text>
  <text x="52" y="308" class="m">Hold IndexInput handles into mapped files</text>

  <rect x="470" y="62" width="426" height="280" rx="8" class="mmap" filter="url(#sh)"/>
  <text x="486" y="86" class="lt" fill="#b45309">Process address space (mmap)</text>

  <rect x="486" y="100" width="394" height="48" rx="6" class="box"/>
  <text x="498" y="122" class="h">MMapDirectory</text>
  <text x="498" y="140" class="m">MemorySegment per file chunk (Java 21+)</text>

  <rect x="486" y="164" width="394" height="150" rx="6" class="box"/>
  <text x="498" y="188" class="h">Segment files (paged by OS on access)</text>
  <text x="498" y="210" class="m">.tim / .tip / .doc  terms + postings</text>
  <text x="498" y="228" class="m">.dim / .dii         BKD (off-heap tree)</text>
  <text x="498" y="246" class="m">.dvd / .dvm         doc values</text>
  <text x="498" y="264" class="m">.fdt / .fdx         stored fields</text>
  <text x="498" y="282" class="m">.liv                live docs (when present)</text>
  <text x="498" y="300" class="m">vector / knn files</text>

  <path d="M454 286 C 460 286, 465 240, 470 240" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="24" y="360" width="872" height="80" rx="8" class="box"/>
  <text x="40" y="384" class="h">Load path</text>
  <text x="40" y="404" class="m">DirectoryReader.open -> SegmentInfos read -> per segment new SegmentReader -> SegmentCoreReaders opens codec producers</text>
  <text x="40" y="422" class="m">NRT reopen: new SegmentReader + new liveDocs/DV; reuse SegmentCoreReaders when segment files unchanged</text>
</svg>
