  <text x="24" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb">2 Stream</text>
  <text x="24" y="200" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb">Graph</text>

  <rect x="110" y="158" width="120" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="170" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamNode</text>
  <text x="170" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">orders</text>

  <rect x="262" y="158" width="120" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="322" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamNode</text>
  <text x="322" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">ParseOrder</text>

  <rect x="510" y="158" width="140" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="580" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamNode</text>
  <text x="580" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">window+agg</text>

  <rect x="682" y="158" width="120" height="64" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="742" y="184" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamNode</text>
  <text x="742" y="204" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">kafkaSink</text>

  <line x1="230" y1="190" x2="262" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="246" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2563eb">fwd</text>

  <line x1="382" y1="190" x2="510" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="446" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2563eb">hash (userId)</text>

  <line x1="650" y1="190" x2="682" y2="190" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arrb)"/>
  <text x="666" y="246" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2563eb">fwd</text>

  <text x="900" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2563eb">StreamEdge</text>
  <text x="900" y="202" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">partitioner</text>

  <!-- transition 2 -> 3 -->
  <line x1="470" y1="256" x2="470" y2="280" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="486" y="260" width="200" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="586" y="275" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">StreamingJobGraphGenerator</text>

  <!-- ========== 3 JobGraph ========== -->
  <text x="24" y="322" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ea580c">3 Job</text>
  <text x="24" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ea580c">Graph</text>

  <rect x="110" y="300" width="260" height="70" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="240" y="328" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">JobVertex A</text>
  <text x="240" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">orders + ParseOrder</text>

  <rect x="510" y="300" width="280" height="70" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="328" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">JobVertex B</text>
  <text x="650" y="350" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">window+agg + kafkaSink</text>

  <line x1="370" y1="335" x2="510" y2="335" stroke="#ea580c" stroke-width="1.6" marker-end="url(#arro)"/>
  <text x="440" y="390" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#c2410c">network (keyBy)</text>

  <!-- transition 3 -> 4 -->
  <line x1="470" y1="400" x2="470" y2="424" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="496" y="404" width="90" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="541" y="419" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">JobMaster</text>

  <!-- ========== 4 ExecutionGraph ========== -->
  <text x="24" y="462" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">4 Exec</text>
  <text x="24" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#059669">Graph</text>

  <rect x="110" y="444" width="64" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="142" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">A.0</text>
  <rect x="186" y="444" width="64" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="218" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">A.1</text>
  <rect x="262" y="444" width="64" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="294" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">A.2</text>

  <rect x="510" y="444" width="64" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="542" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">B.0</text>
  <rect x="586" y="444" width="64" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="618" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">B.1</text>
  <rect x="662" y="444" width="64" height="44" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.3"/>
  <text x="694" y="470" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0f172a">B.2</text>

  <line x1="326" y1="466" x2="510" y2="466" stroke="#059669" stroke-width="1.5" marker-end="url(#arrg)"/>
  <text x="418" y="458" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#059669">shuffle</text>

  <text x="860" y="464" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#059669">ExecutionVertex</text>
  <text x="860" y="480" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">per subtask</text>

  <line x1="470" y1="488" x2="470" y2="508" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="548" y="504" font-family="Consolas, monospace" font-size="10" fill="#475569">deploy to slots</text>

  <rect x="110" y="516" width="680" height="30" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="450" y="535" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0f172a">StreamTask instances for orders-per-minute on TaskManager slots</text>
</svg>
