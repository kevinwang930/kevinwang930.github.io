<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-label="Raft protocol: roles, AppendEntries, majority commit">
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1565c0"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#546e7a"/>
    </marker>
  </defs>

  <rect width="1000" height="520" fill="#f7f9fb"/>
  <text x="500" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Raft protocol (one consensus group, RF=3)</text>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">One leader accepts client writes; replicates via AppendEntries; commits only with majority</text>

  <!-- Roles legend -->
  <g transform="translate(40, 70)">
    <rect width="920" height="70" fill="#ffffff" stroke="#90a4ae" stroke-width="1.2" rx="5"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#37474f">Roles</text>
    <text x="20" y="50" font-family="Consolas, monospace" font-size="11" fill="#2e7d32">Leader</text>
    <text x="90" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">serves writes / heartbeats</text>
    <text x="320" y="50" font-family="Consolas, monospace" font-size="11" fill="#546e7a">Follower</text>
    <text x="400" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">replicates log; redirects clients</text>
    <text x="640" y="50" font-family="Consolas, monospace" font-size="11" fill="#ef6c00">Candidate</text>
    <text x="730" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">election only (RequestVote)</text>
  </g>

  <!-- Leader -->
  <g transform="translate(60, 170)">
    <rect width="260" height="200" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" rx="6"/>
    <text x="130" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1b5e20">LEADER</text>
    <text x="130" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#2e7d32">term = T</text>
    <rect x="24" y="70" width="212" height="110" fill="#ffffff" stroke="#81c784" rx="4"/>
    <text x="130" y="98" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">1. accept client write</text>
    <text x="130" y="120" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">2. append local log</text>
    <text x="130" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">3. AppendEntries to peers</text>
    <text x="130" y="164" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">4. advance commitIndex</text>
  </g>

  <!-- Follower A -->
  <g transform="translate(400, 190)">
    <rect width="220" height="160" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="6"/>
    <text x="110" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#37474f">FOLLOWER A</text>
    <text x="110" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#546e7a">term = T</text>
    <text x="110" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">persist entries</text>
    <text x="110" y="114" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">ack match index</text>
    <text x="110" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">no client writes</text>
  </g>

  <!-- Follower B -->
  <g transform="translate(700, 190)">
    <rect width="220" height="160" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="6"/>
    <text x="110" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#37474f">FOLLOWER B</text>
    <text x="110" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#546e7a">term = T</text>
    <text x="110" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">persist entries</text>
    <text x="110" y="114" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#37474f">ack match index</text>
    <text x="110" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">no client writes</text>
  </g>

  <!-- AppendEntries arrows -->
  <line x1="320" y1="250" x2="400" y2="250" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrG)"/>
  <line x1="320" y1="290" x2="700" y2="270" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#arrG)"/>
  <text x="360" y="238" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#2e7d32">AppendEntries</text>

  <!-- Client -->
  <g transform="translate(90, 400)">
    <rect width="200" height="50" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.4" rx="5"/>
    <text x="100" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">Client write</text>
  </g>
  <line x1="190" y1="400" x2="190" y2="370" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrB)"/>

  <!-- Quorum box -->
  <g transform="translate(400, 400)">
    <rect width="520" height="80" fill="#fff8e1" stroke="#f9a825" stroke-width="1.4" rx="5"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">Majority quorum</text>
    <text x="20" y="50" font-family="Consolas, monospace" font-size="11" fill="#37474f">majority(N) = floor(N/2)+1   |   RF=3 needs 2 voters</text>
    <text x="20" y="68" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">Election and commit both require majority =&gt; no split-brain under partition</text>
  </g>
</svg>
