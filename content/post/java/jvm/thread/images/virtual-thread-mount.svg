<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Many virtual threads run on a few carrier threads; a running virtual thread is mounted on one carrier, a parked one keeps its frames in a heap StackChunk, and a pinned one holds a carrier">
  <rect width="960" height="520" fill="#ffffff"/>
  <defs>
    <marker id="va" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="480" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#263238">Virtual threads on carriers</text>

    <text x="40" y="60" font-size="12" font-weight="700" fill="#4a148c">Virtual threads</text>
    <rect x="40" y="72" width="216" height="56" rx="26" fill="#f3e5f5" stroke="#8e24aa" stroke-width="2"/>
    <text x="148" y="96" text-anchor="middle" font-size="11" font-weight="700" fill="#4a148c">VT 1</text>
    <text x="148" y="114" text-anchor="middle" font-size="10" fill="#6a1b9a">RUNNING</text>

    <rect x="40" y="142" width="216" height="56" rx="26" fill="#ffffff" stroke="#b39ddb"/>
    <text x="148" y="166" text-anchor="middle" font-size="11" fill="#4a148c">VT 2</text>
    <text x="148" y="184" text-anchor="middle" font-size="10" fill="#7e57c2">PARKED</text>

    <rect x="40" y="212" width="216" height="56" rx="26" fill="#ffffff" stroke="#b39ddb"/>
    <text x="148" y="236" text-anchor="middle" font-size="11" fill="#4a148c">VT 3</text>
    <text x="148" y="254" text-anchor="middle" font-size="10" fill="#7e57c2">BLOCKED on a monitor</text>

    <rect x="40" y="282" width="216" height="56" rx="26" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="148" y="306" text-anchor="middle" font-size="11" font-weight="700" fill="#880e4f">VT 4</text>
    <text x="148" y="324" text-anchor="middle" font-size="10" fill="#ad1457">PINNED</text>

    <rect x="40" y="352" width="216" height="40" rx="3" fill="#fafafa" stroke="#b0b0b0"/>
    <text x="148" y="377" text-anchor="middle" font-size="9" fill="#546e7a">thousands of them cost little</text>

    <text x="376" y="60" font-size="12" font-weight="700" fill="#1b5e20">Carriers, a ForkJoinPool of CarrierThreads</text>
    <rect x="376" y="72" width="248" height="66" rx="3" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="500" y="94" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">Carrier 0</text>
    <text x="500" y="112" text-anchor="middle" font-size="9" fill="#2e7d32">now running VT 1</text>
    <text x="500" y="128" text-anchor="middle" font-size="9" fill="#78909c">currentThread() returns VT 1</text>

    <rect x="376" y="152" width="248" height="50" rx="3" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="500" y="172" text-anchor="middle" font-size="11" fill="#1b5e20">Carrier 1</text>
    <text x="500" y="190" text-anchor="middle" font-size="9" fill="#2e7d32">free, takes the next task</text>

    <rect x="376" y="216" width="248" height="50" rx="3" fill="#fce4ec" stroke="#ad1457"/>
    <text x="500" y="236" text-anchor="middle" font-size="11" fill="#880e4f">Carrier 2</text>
    <text x="500" y="254" text-anchor="middle" font-size="9" fill="#ad1457">parked, VT 4 is pinned on it</text>

    <rect x="376" y="280" width="248" height="46" rx="3" fill="#ffffff" stroke="#90a4ae" stroke-dasharray="4 3"/>
    <text x="500" y="300" text-anchor="middle" font-size="10" fill="#546e7a">Carrier 3 ... up to maxPoolSize</text>
    <text x="500" y="318" text-anchor="middle" font-size="9" fill="#78909c">parallelism defaults to the CPU count</text>

    <line x1="260" y1="100" x2="372" y2="100" stroke="#37474f" stroke-width="2" marker-end="url(#va)"/>
    <text x="316" y="90" text-anchor="middle" font-size="9" fill="#37474f">mount</text>
    <line x1="372" y1="240" x2="264" y2="308" stroke="#ad1457" stroke-width="2" marker-end="url(#va)"/>
    <text x="318" y="292" text-anchor="middle" font-size="9" fill="#ad1457">pinned</text>

    <text x="672" y="60" font-size="12" font-weight="700" fill="#0d47a1">Heap</text>
    <rect x="672" y="72" width="252" height="140" rx="3" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="798" y="92" text-anchor="middle" font-size="10" font-weight="700" fill="#0d47a1">StackChunk of VT 2</text>
    <rect x="686" y="102" width="224" height="24" fill="#bbdefb" stroke="#1565c0"/>
    <text x="798" y="119" text-anchor="middle" font-size="9" fill="#0d47a1">frame n</text>
    <rect x="686" y="130" width="224" height="24" fill="#bbdefb" stroke="#1565c0"/>
    <text x="798" y="147" text-anchor="middle" font-size="9" fill="#0d47a1">frame n-1</text>
    <rect x="686" y="158" width="224" height="24" fill="#bbdefb" stroke="#1565c0"/>
    <text x="798" y="175" text-anchor="middle" font-size="9" fill="#0d47a1">frame 0</text>
    <text x="798" y="200" text-anchor="middle" font-size="9" fill="#546e7a">grows as needed</text>

    <rect x="672" y="230" width="252" height="96" rx="3" fill="#e3f2fd" stroke="#90caf9" stroke-dasharray="4 3"/>
    <text x="798" y="252" text-anchor="middle" font-size="10" font-weight="700" fill="#0d47a1">StackChunk of VT 3</text>
    <rect x="686" y="262" width="224" height="24" fill="#e3f2fd" stroke="#90caf9"/>
    <text x="798" y="279" text-anchor="middle" font-size="9" fill="#1565c0">frames</text>
    <text x="798" y="304" text-anchor="middle" font-size="9" fill="#546e7a">a blocked virtual thread unmounts too</text>

    <line x1="260" y1="170" x2="668" y2="130" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#va)"/>
    <text x="470" y="142" text-anchor="middle" font-size="9" fill="#1565c0">unmount copies the frames out</text>
    <line x1="260" y1="240" x2="668" y2="265" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#va)"/>

    <rect x="40" y="410" width="884" height="92" rx="4" fill="#fafafa" stroke="#b0b0b0"/>
    <text x="56" y="432" font-size="11" font-weight="700" fill="#263238">What makes it cheaper</text>
    <text x="56" y="454" font-size="10" fill="#37474f">A carrier reserves a native stack, 1 MB by default on 64-bit Linux, and holds a kernel scheduling slot for its whole life.</text>
    <text x="56" y="472" font-size="10" fill="#37474f">A parked virtual thread reserves neither. Its cost is close to the objects that represent it: a VirtualThread, a Continuation and its StackChunk.</text>
    <text x="56" y="492" font-size="10" fill="#37474f">That is why blocking I/O scales: the carrier is released while the virtual thread waits, instead of a carrier sitting idle.</text>
  </g>
</svg>
