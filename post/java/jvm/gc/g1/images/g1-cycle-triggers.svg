<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="730" viewBox="0 0 980 730" role="img" aria-label="State machine of the G1 cycle grouped by thread pool: the VM thread and GC Thread pool package holds every cycle step except Concurrent Mark, which the G1 Main Marker and G1 Conc pool package executes; arrows are the calls between pools; the G1 Refinement Workers package runs between pauses">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#455a64"/>
    </marker>
    <marker id="arrIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#5c6bc0"/>
    </marker>
    <marker id="arrLoop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#90a4ae"/>
    </marker>
  </defs>
  <rect width="980" height="730" fill="#ffffff"/>
  <text x="490" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">What triggers each step of the G1 cycle</text>
  <text x="490" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">Steps are grouped in the thread pool that executes them; the arrows are the calls between pools.</text>

  <!-- package: G1 Main Marker + G1 Conc pool -->
  <rect x="560" y="56" width="390" height="116" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="578" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#37474f">G1 Main Marker + G1 Conc pool</text>
  <rect x="590" y="90" width="330" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="755" y="114" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1565c0">Concurrent Mark</text>
  <text x="755" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9.5" fill="#607d8b">runs beside the mutators</text>

  <!-- package: VM thread + GC Thread pool -->
  <rect x="30" y="246" width="920" height="314" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="48" y="270" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#37474f">VM thread + GC Thread pool</text>
  <text x="48" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">every stop-the-world pause</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- row 1: Young promotion -&gt; Concurrent Start -->
    <rect x="60" y="296" width="190" height="56" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
    <text x="155" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d47a1">Young promotion</text>
    <text x="155" y="338" text-anchor="middle" font-size="9.5" fill="#607d8b">allocation failure starts each one</text>

    <line x1="254" y1="324" x2="304" y2="324" stroke="#455a64" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="280" y="282" text-anchor="middle" font-size="10" fill="#546e7a">IHOP check arms it</text>

    <rect x="310" y="296" width="200" height="56" rx="8" fill="#e8eaf6" stroke="#0d47a1" stroke-width="2"/>
    <text x="410" y="320" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0d47a1">Concurrent Start</text>
    <text x="410" y="338" text-anchor="middle" font-size="9.5" fill="#607d8b">young pause that starts marking</text>

    <!-- call: VM pool to marker pool -->
    <path d="M 410 296 V 212 H 620 V 172" fill="none" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrIndigo)"/>
    <text x="515" y="190" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#303f9f">call: start_concurrent_cycle()</text>
    <text x="515" y="204" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="9.5" fill="#303f9f">notify() wakes the marker thread</text>

    <!-- call: marker pool to Remark -->
    <path d="M 755 172 V 386 H 860 V 400" fill="none" stroke="#5c6bc0" stroke-width="2" marker-end="url(#arrIndigo)"/>
    <text x="840" y="374" text-anchor="middle" font-size="10" fill="#303f9f">marker posts VM_G1PauseRemark</text>

    <!-- row 2: Remark -&gt; Cleanup -&gt; Prepare Mixed -&gt; Mixed -&gt; Restart -->
    <rect x="780" y="400" width="160" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="860" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e65100">Remark</text>
    <text x="860" y="442" text-anchor="middle" font-size="9.5" fill="#607d8b">stop-the-world pause</text>

    <line x1="778" y1="428" x2="766" y2="428" stroke="#455a64" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="770" y="472" text-anchor="middle" font-size="10" fill="#546e7a">marker posts VM_G1PauseCleanup</text>

    <rect x="600" y="400" width="160" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
    <text x="680" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#e65100">Cleanup</text>
    <text x="680" y="442" text-anchor="middle" font-size="9.5" fill="#607d8b">stop-the-world pause</text>

    <line x1="598" y1="428" x2="586" y2="428" stroke="#455a64" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="590" y="472" text-anchor="middle" font-size="10" fill="#546e7a">candidates exist → prepare mixed</text>

    <rect x="420" y="400" width="160" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
    <text x="500" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#455a64">Prepare Mixed</text>
    <text x="500" y="442" text-anchor="middle" font-size="9.5" fill="#607d8b">young pause that builds the CSet</text>

    <line x1="418" y1="428" x2="406" y2="428" stroke="#455a64" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="410" y="472" text-anchor="middle" font-size="10" fill="#546e7a">state → in_space_reclamation</text>

    <rect x="240" y="400" width="160" height="56" rx="8" fill="#fce4ec" stroke="#ad1457" stroke-width="2"/>
    <text x="320" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ad1457">Mixed</text>
    <text x="320" y="442" text-anchor="middle" font-size="9.5" fill="#607d8b">young + old evacuation</text>

    <line x1="238" y1="428" x2="226" y2="428" stroke="#455a64" stroke-width="2" marker-end="url(#arrGray)"/>
    <text x="230" y="472" text-anchor="middle" font-size="10" fill="#546e7a">next_gc_should_be_mixed() == false</text>

    <rect x="60" y="400" width="160" height="56" rx="8" fill="#eceff1" stroke="#455a64" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="140" y="424" text-anchor="middle" font-size="12.5" font-weight="700" fill="#455a64">Restart Young-Only</text>
    <text x="140" y="442" text-anchor="middle" font-size="9.5" fill="#607d8b">state change at pause end</text>

    <!-- cycle loop back to Young promotion -->
    <path d="M 140 456 V 520 H 44 V 324 H 58" fill="none" stroke="#90a4ae" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrLoop)"/>
    <text x="86" y="534" text-anchor="middle" font-size="11" fill="#90a4ae">the cycle repeats</text>
  </g>

  <!-- package: G1 Refine Control + G1 Refinement Workers -->
  <rect x="30" y="580" width="920" height="76" rx="10" fill="#fafafa" stroke="#b0bec5" stroke-width="1.5" stroke-dasharray="7 4"/>
  <text x="48" y="604" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#37474f">G1 Refine Control + G1 Refinement Workers</text>
  <text x="48" y="622" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">No cycle step runs here: it sweeps dirty cards into remembered sets between pauses, on its own timer and after each collection.</text>
  <text x="48" y="638" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">It never starts a pause; it only prepares remembered sets for later evacuation.</text>

  <text x="490" y="690" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">Full GC is outside the cycle: it is the backup when evacuation cannot free enough space.</text>
  <text x="490" y="708" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">If Cleanup finds no old candidates, the cycle returns straight to Young promotion; mixed pauses repeat while candidates remain.</text>
</svg>
