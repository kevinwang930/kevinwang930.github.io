<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="340" viewBox="0 0 920 340" role="img" aria-label="Write barriers: card dirtying feeds remembered sets; SATB buffers feed concurrent mark">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="920" height="340" fill="#f7f9fb"/>
  <text x="460" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">Remembered sets and write barriers</text>
  <text x="460" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">Cards approximate heap locations; SATB preserves the marking snapshot</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="360" y="70" width="140" height="48" rx="6" fill="#eceff1" stroke="#607d8b"/>
    <text x="430" y="99" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">oop store</text>

    <!-- left path: cards / RSet -->
    <line x1="360" y1="94" x2="280" y2="94" stroke="#37474f" stroke-width="1.5"/>
    <line x1="280" y1="94" x2="280" y2="140" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="190" y="146" width="180" height="40" rx="6" fill="#fff8e1" stroke="#f9a825"/>
    <text x="280" y="171" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">Dirty card</text>
    <line x1="280" y1="186" x2="280" y2="214" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="190" y="220" width="180" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="280" y="245" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">Concurrent refinement</text>
    <line x1="280" y1="260" x2="280" y2="288" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="160" y="294" width="240" height="30" rx="6" fill="#bbdefb" stroke="#1565c0"/>
    <text x="280" y="314" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">Region remembered set</text>

    <!-- right path: SATB -->
    <line x1="500" y1="94" x2="640" y2="94" stroke="#37474f" stroke-width="1.5"/>
    <line x1="640" y1="94" x2="640" y2="140" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="540" y="146" width="200" height="40" rx="6" fill="#f3e5f5" stroke="#8e24aa"/>
    <text x="640" y="164" text-anchor="middle" font-size="12" font-weight="700" fill="#6a1b9a">SATB enqueue</text>
    <text x="640" y="180" text-anchor="middle" font-size="11" fill="#8e24aa">if marking active</text>
    <line x1="640" y1="186" x2="640" y2="230" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="540" y="236" width="200" height="48" rx="6" fill="#ede7f6" stroke="#5e35b1"/>
    <text x="640" y="256" text-anchor="middle" font-size="12" font-weight="700" fill="#4527a0">Concurrent mark</text>
    <text x="640" y="274" text-anchor="middle" font-size="11" fill="#5e35b1">drain SATB buffers</text>

    <!-- RSet to evacuation -->
    <path d="M 400 309 L 500 309 L 500 220 L 540 220" fill="none" stroke="#37474f" stroke-width="1.3" marker-end="url(#arr)"/>
    <rect x="430" y="186" width="160" height="40" rx="6" fill="#ffcdd2" stroke="#c62828"/>
    <text x="510" y="203" text-anchor="middle" font-size="11" font-weight="700" fill="#b71c1c">CSet root scan</text>
    <text x="510" y="218" text-anchor="middle" font-size="10" fill="#c62828">STW pause</text>
  </g>
</svg>
