<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="Redis type versus encoding">
  <rect width="960" height="520" fill="#f7f9fb"/>
  <text x="480" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Redis value: type (API) vs encoding (storage)</text>
  <text x="480" y="50" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Commands see the type. The encoding may change as the value grows.</text>

  <!-- robj box -->
  <rect x="300" y="70" width="360" height="70" fill="#eceff1" stroke="#546e7a" stroke-width="1.5" rx="8"/>
  <text x="480" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#37474f">robj / kvobj</text>
  <text x="480" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#546e7a">type | encoding | refcount | ptr</text>

  <!-- Types row -->
  <text x="80" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">Logical type</text>
  <rect x="40" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="90" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">STRING</text>
  <rect x="155" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="205" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">LIST</text>
  <rect x="270" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="320" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">SET</text>
  <rect x="385" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="435" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">ZSET</text>
  <rect x="500" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="550" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">HASH</text>
  <rect x="615" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="665" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">STREAM</text>
  <rect x="730" y="195" width="100" height="40" fill="#e3f2fd" stroke="#1565c0" rx="5"/><text x="780" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">MODULE</text>

  <!-- Encodings -->
  <text x="80" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">Common encodings</text>

  <rect x="40" y="300" width="200" height="90" fill="#e8f5e9" stroke="#2e7d32" rx="6"/>
  <text x="140" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">STRING</text>
  <text x="140" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#33691e">INT / EMBSTR / RAW</text>
  <text x="140" y="370" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#78909c">sds / long</text>

  <rect x="260" y="300" width="200" height="90" fill="#e8f5e9" stroke="#2e7d32" rx="6"/>
  <text x="360" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">LIST</text>
  <text x="360" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#33691e">LISTPACK / QUICKLIST</text>
  <text x="360" y="370" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#78909c">compact then nodes</text>

  <rect x="480" y="300" width="200" height="90" fill="#e8f5e9" stroke="#2e7d32" rx="6"/>
  <text x="580" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">SET</text>
  <text x="580" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#33691e">INTSET / LISTPACK / HT</text>
  <text x="580" y="370" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#78909c">by member shape</text>

  <rect x="700" y="300" width="200" height="90" fill="#e8f5e9" stroke="#2e7d32" rx="6"/>
  <text x="800" y="325" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">HASH / ZSET</text>
  <text x="800" y="348" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#33691e">LISTPACK / HT</text>
  <text x="800" y="370" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#33691e">LISTPACK / SKIPLIST+HT</text>

  <rect x="260" y="415" width="440" height="70" fill="#fff8e1" stroke="#f9a825" rx="6"/>
  <text x="480" y="445" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#f57f17">STREAM encoding</text>
  <text x="480" y="468" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6d4c41">rax of listpacks (OBJ_ENCODING_STREAM)</text>
</svg>
