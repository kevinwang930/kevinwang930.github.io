<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="640" viewBox="0 0 860 640" role="img" aria-label="Environment model: two calls to make-adder produce two frames">
  <defs>
    <marker id="solid" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#000000"/>
    </marker>
    <marker id="dash" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto">
      <polygon points="0,0 9,3.5 0,7" fill="#000000"/>
    </marker>
  </defs>

  <rect width="860" height="640" fill="#ffffff"/>

  <text x="30" y="28" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">(define (make-adder n) (lambda (x) (+ x n)))</text>
  <text x="30" y="48" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">(define add2 (make-adder 2))</text>
  <text x="30" y="68" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">(define add5 (make-adder 5))</text>
  <text x="30" y="88" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">(add2 10)   (add5 10)</text>

  <!-- global environment -->
  <rect x="30" y="130" width="760" height="160" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="42" y="122" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="700" fill="#000000">global env</text>

  <text x="46" y="178" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">make-adder : (lambda (n) (lambda (x) (+ x n)))</text>
  <text x="46" y="228" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">add2 : (lambda (x) (+ x n))</text>
  <text x="46" y="278" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">add5 : (lambda (x) (+ x n))</text>

  <!-- add2's environment part points at E1 -->
  <circle cx="262" cy="223" r="3.5" fill="#000000"/>
  <line x1="266" y1="223" x2="176" y2="342" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#dash)"/>

  <!-- add5's environment part points at E2 -->
  <circle cx="262" cy="273" r="3.5" fill="#000000"/>
  <line x1="266" y1="273" x2="560" y2="342" stroke="#000000" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#dash)"/>

  <!-- frame E1: (make-adder 2) -->
  <rect x="40" y="346" width="250" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="52" y="338" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="700" fill="#000000">E1   (make-adder 2)</text>
  <text x="56" y="396" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">n : 2</text>
  <line x1="100" y1="346" x2="100" y2="296" stroke="#000000" stroke-width="1.4" marker-end="url(#solid)"/>
  <text x="110" y="322" font-family="Courier New, Courier, monospace" font-size="11" fill="#000000">enclosing env</text>

  <!-- frame E2: (make-adder 5) -->
  <rect x="560" y="346" width="250" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="572" y="338" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="700" fill="#000000">E2   (make-adder 5)</text>
  <text x="576" y="396" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">n : 5</text>
  <line x1="620" y1="346" x2="620" y2="296" stroke="#000000" stroke-width="1.4" marker-end="url(#solid)"/>
  <text x="630" y="322" font-family="Courier New, Courier, monospace" font-size="11" fill="#000000">enclosing env</text>

  <!-- the call (add2 10) -->
  <rect x="40" y="500" width="250" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="52" y="492" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="700" fill="#000000">E3   (add2 10)</text>
  <text x="56" y="550" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">x : 10</text>
  <line x1="100" y1="500" x2="100" y2="442" stroke="#000000" stroke-width="1.4" marker-end="url(#solid)"/>

  <!-- the call (add5 10) -->
  <rect x="560" y="500" width="250" height="90" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
  <text x="572" y="492" font-family="Courier New, Courier, monospace" font-size="12.5" font-weight="700" fill="#000000">E4   (add5 10)</text>
  <text x="576" y="550" font-family="Courier New, Courier, monospace" font-size="12" fill="#000000">x : 10</text>
  <line x1="620" y1="500" x2="620" y2="442" stroke="#000000" stroke-width="1.4" marker-end="url(#solid)"/>

  <!-- key -->
  <text x="330" y="600" font-family="Courier New, Courier, monospace" font-size="11" fill="#000000">solid: enclosing env</text>
  <text x="330" y="620" font-family="Courier New, Courier, monospace" font-size="11" fill="#000000">dashed: environment part of a value</text>
</svg>
