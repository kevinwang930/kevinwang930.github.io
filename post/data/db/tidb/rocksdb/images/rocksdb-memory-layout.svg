<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="RocksDB in-memory object layout">
  <rect width="1000" height="560" fill="#f7f9fb"/>
  <text x="500" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">Memory layout (DBImpl)</text>
  <text x="500" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Process heap after Open: one DBImpl, shared VersionSet/WAL, per-CF MemTables + SuperVersion</text>

  <g transform="translate(30,70)">
    <rect width="940" height="70" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="5"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0d47a1">DBImpl</text>
    <text x="20" y="52" font-family="Consolas, monospace" font-size="11" fill="#37474f">versions_ : VersionSet*     wal_manager_     write_thread_ / mutex_     write_buffer_manager_</text>
  </g>

  <line x1="200" y1="140" x2="200" y2="170" stroke="#37474f" stroke-width="1.4"/>
  <line x1="500" y1="140" x2="500" y2="170" stroke="#37474f" stroke-width="1.4"/>
  <line x1="800" y1="140" x2="800" y2="170" stroke="#37474f" stroke-width="1.4"/>

  <g transform="translate(40,175)">
    <rect width="300" height="100" fill="#fff8e1" stroke="#f9a825" rx="4"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">VersionSet</text>
    <text x="16" y="52" font-family="Consolas, monospace" font-size="10" fill="#37474f">current Version per CF</text>
    <text x="16" y="72" font-family="Consolas, monospace" font-size="10" fill="#37474f">file numbers, last sequence</text>
    <text x="16" y="92" font-family="Consolas, monospace" font-size="10" fill="#78909c">LogAndApply -&gt; MANIFEST</text>
  </g>

  <g transform="translate(350,175)">
    <rect width="300" height="100" fill="#eceff1" stroke="#90a4ae" rx="4"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#546e7a">WalManager</text>
    <text x="16" y="52" font-family="Consolas, monospace" font-size="10" fill="#37474f">alive log writers</text>
    <text x="16" y="72" font-family="Consolas, monospace" font-size="10" fill="#37474f">log numbers</text>
    <text x="16" y="92" font-family="Consolas, monospace" font-size="10" fill="#78909c">shared by all CFs</text>
  </g>

  <g transform="translate(660,175)">
    <rect width="300" height="100" fill="#fce4ec" stroke="#c2185b" rx="4"/>
    <text x="16" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ad1457">Write path</text>
    <text x="16" y="52" font-family="Consolas, monospace" font-size="10" fill="#37474f">WriteThread leaders</text>
    <text x="16" y="72" font-family="Consolas, monospace" font-size="10" fill="#37474f">DB mutex</text>
    <text x="16" y="92" font-family="Consolas, monospace" font-size="10" fill="#78909c">WriteBufferManager</text>
  </g>

  <!-- CF boxes -->
  <text x="500" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">ColumnFamilyData (one per CF)</text>

  <g transform="translate(30,325)">
    <rect width="300" height="210" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="5"/>
    <text x="150" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">CF lock</text>
    <rect x="14" y="40" width="272" height="44" fill="#fffde7" stroke="#f9a825" rx="3"/>
    <text x="24" y="58" font-family="Consolas, monospace" font-size="10" fill="#e65100">mem_   active MemTable</text>
    <text x="24" y="74" font-family="Consolas, monospace" font-size="10" fill="#78909c">skiplist + arena</text>
    <rect x="14" y="94" width="272" height="36" fill="#fff3e0" stroke="#ef6c00" rx="3"/>
    <text x="24" y="116" font-family="Consolas, monospace" font-size="10" fill="#ef6c00">imm_   MemTableList (flushing)</text>
    <rect x="14" y="140" width="272" height="54" fill="#e3f2fd" stroke="#1565c0" rx="3"/>
    <text x="24" y="160" font-family="Consolas, monospace" font-size="10" fill="#0d47a1">super_version_</text>
    <text x="24" y="178" font-family="Consolas, monospace" font-size="10" fill="#546e7a">-&gt; mem, imm, current Version</text>
  </g>

  <g transform="translate(350,325)">
    <rect width="300" height="210" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="5"/>
    <text x="150" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">CF write</text>
    <rect x="14" y="40" width="272" height="44" fill="#fffde7" stroke="#f9a825" rx="3"/>
    <text x="24" y="58" font-family="Consolas, monospace" font-size="10" fill="#e65100">mem_</text>
    <text x="24" y="74" font-family="Consolas, monospace" font-size="10" fill="#78909c">skiplist + arena</text>
    <rect x="14" y="94" width="272" height="36" fill="#fff3e0" stroke="#ef6c00" rx="3"/>
    <text x="24" y="116" font-family="Consolas, monospace" font-size="10" fill="#ef6c00">imm_</text>
    <rect x="14" y="140" width="272" height="54" fill="#e3f2fd" stroke="#90caf9" rx="3"/>
    <text x="24" y="160" font-family="Consolas, monospace" font-size="10" fill="#0d47a1">super_version_</text>
    <text x="24" y="178" font-family="Consolas, monospace" font-size="10" fill="#546e7a">current_ -&gt; L0..Ln FileMetaData</text>
  </g>

  <g transform="translate(670,325)">
    <rect width="300" height="210" fill="#f3e5f5" stroke="#7b1fa2" stroke-width="1.5" rx="5"/>
    <text x="150" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6a1b9a">CF default</text>
    <rect x="14" y="40" width="272" height="44" fill="#fffde7" stroke="#f9a825" rx="3"/>
    <text x="24" y="58" font-family="Consolas, monospace" font-size="10" fill="#e65100">mem_</text>
    <text x="24" y="74" font-family="Consolas, monospace" font-size="10" fill="#78909c">skiplist + arena</text>
    <rect x="14" y="94" width="272" height="36" fill="#fff3e0" stroke="#ef6c00" rx="3"/>
    <text x="24" y="116" font-family="Consolas, monospace" font-size="10" fill="#ef6c00">imm_</text>
    <rect x="14" y="140" width="272" height="54" fill="#e8eaf6" stroke="#5c6bc0" rx="3"/>
    <text x="24" y="160" font-family="Consolas, monospace" font-size="10" fill="#3949ab">super_version_</text>
    <text x="24" y="178" font-family="Consolas, monospace" font-size="10" fill="#546e7a">(+ block cache refs)</text>
  </g>
</svg>
