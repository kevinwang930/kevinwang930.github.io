<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="TiDB write path to TiKV Multi-Raft Region">
  <defs>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#546e7a"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1565c0"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <rect width="1000" height="560" fill="#f7f9fb"/>
  <text x="500" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">TiDB write path to Region Raft (CP per Region)</text>
  <text x="500" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">git/tidb owns SQL + client-go; Multi-Raft runs in TiKV (outside the TiDB process)</text>

  <!-- ========== TiDB ========== -->
  <g transform="translate(40, 70)">
    <rect width="300" height="180" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.8" rx="6"/>
    <text x="150" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">TiDB process (git/tidb)</text>
    <text x="150" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">no Raft RawNode here</text>

    <rect x="20" y="60" width="260" height="100" fill="#ffffff" stroke="#1976d2" stroke-width="1.2" rx="4"/>
    <text x="150" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1565c0">SQL / planner / executor</text>
    <text x="150" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1565c0">TiKVDriver.Open(tikv://pd...)</text>
    <text x="150" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1565c0">client-go KVStore</text>
    <text x="150" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#37474f">twoPhaseCommitter</text>
  </g>

  <!-- ========== PD ========== -->
  <g transform="translate(400, 70)">
    <rect width="220" height="180" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8" rx="6"/>
    <text x="110" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">PD</text>
    <text x="110" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d4c41">control plane</text>

    <rect x="20" y="66" width="180" height="90" fill="#ffffff" stroke="#f9a825" stroke-width="1.2" rx="4"/>
    <text x="110" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ef6c00">TSO startTS / commitTS</text>
    <text x="110" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ef6c00">Region locate / meta</text>
    <text x="110" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">schedules TiKV peers</text>
  </g>

  <!-- TiDB -> PD -->
  <line x1="340" y1="160" x2="400" y2="160" stroke="#ef6c00" stroke-width="1.8" marker-end="url(#arrAmber)"/>
  <text x="370" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#ef6c00">TSO / locate</text>

  <!-- ========== TiKV Multi-Raft ========== -->
  <g transform="translate(40, 300)">
    <rect width="920" height="230" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.8" rx="6"/>
    <text x="460" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">TiKV Multi-Raft  |  one Region, RF=3 (production engine outside TiDB)</text>
  </g>

  <!-- Leader store -->
  <g transform="translate(70, 350)">
    <rect width="240" height="150" fill="#ffffff" stroke="#2e7d32" stroke-width="1.8" rx="5"/>
    <text x="120" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">Store 1  |  LEADER</text>
    <text x="120" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">gRPC Prewrite / Commit</text>
    <text x="120" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">1. propose -&gt; Raft log</text>
    <text x="120" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">2. wait majority CommitLog</text>
    <text x="120" y="118" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">3. apply MVCC</text>
    <text x="120" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#78909c">RPC returns after step 2+3</text>
  </g>

  <!-- Follower 2 -->
  <g transform="translate(380, 370)">
    <rect width="200" height="110" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="5"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">Store 2  |  FOLLOWER</text>
    <text x="100" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">AppendEntries</text>
    <text x="100" y="80" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">persist Raft log</text>
  </g>

  <!-- Follower 3 -->
  <g transform="translate(650, 370)">
    <rect width="200" height="110" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="5"/>
    <text x="100" y="32" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">Store 3  |  FOLLOWER</text>
    <text x="100" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">AppendEntries</text>
    <text x="100" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">majority = 2 of 3</text>
  </g>

  <!-- TiDB -> Leader -->
  <path d="M 190 250 L 190 280 L 190 350" fill="none" stroke="#1565c0" stroke-width="1.8" marker-end="url(#arrBlue)"/>
  <text x="210" y="300" font-family="Consolas, monospace" font-size="9" fill="#1565c0">kvrpcpb to leader</text>

  <!-- PD note (side) -->
  <text x="700" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">NotLeader -&gt; refresh</text>
  <text x="700" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">RegionCache from PD</text>

  <!-- Raft replicate: leader -> follower2, leader -> follower3 -->
  <line x1="310" y1="425" x2="380" y2="425" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
  <line x1="310" y1="445" x2="650" y2="445" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arrGreen)"/>
  <text x="520" y="438" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#2e7d32">Raft replicate</text>
</svg>
