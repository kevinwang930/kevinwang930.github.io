<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Cache hierarchy of two x86 cores: each has a private store buffer, L1 and L2, both drain into a shared L3 that acts as the coherency point above main memory">
  <rect width="960" height="500" fill="#ffffff"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">

    <text x="40" y="26" font-size="12" font-weight="700" fill="#263238">private above, shared below</text>

    <!-- core 0 -->
    <rect x="40" y="40" width="400" height="248" rx="4" fill="#f5f9fd" stroke="#1565c0" stroke-width="2"/>
    <text x="240" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">core 0</text>

    <rect x="60" y="72" width="160" height="200" fill="#fff59d" stroke="#f9a825" stroke-width="2"/>
    <text x="140" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#f57f17">store buffer</text>
    <text x="140" y="106" text-anchor="middle" font-size="9" fill="#8d6e00">private to this core</text>
    <text x="72" y="130" font-size="9" font-weight="700" fill="#37474f">before lock</text>
    <rect x="72" y="136" width="136" height="18" fill="#ffffff" stroke="#90a4ae"/>
    <text x="140" y="149" text-anchor="middle" font-size="9" fill="#37474f">data = 42</text>
    <rect x="72" y="156" width="136" height="18" fill="#ffffff" stroke="#90a4ae"/>
    <text x="140" y="169" text-anchor="middle" font-size="9" fill="#37474f">ready = 1</text>
    <text x="72" y="196" font-size="9" font-weight="700" fill="#37474f">after lock</text>
    <rect x="72" y="202" width="136" height="18" fill="#ffffff" stroke="#90a4ae"/>
    <text x="140" y="215" text-anchor="middle" font-size="9" fill="#546e7a">empty</text>
    <text x="140" y="246" text-anchor="middle" font-size="9" fill="#8d6e00">not visible to core 1</text>

    <line x1="220" y1="130" x2="248" y2="130" stroke="#37474f" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="250" y="72" width="172" height="96" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
    <text x="336" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">L1 cache</text>
    <text x="336" y="106" text-anchor="middle" font-size="9" fill="#2e7d32">private</text>
    <text x="262" y="128" font-size="9" fill="#546e7a">before  data=0 ready=0</text>
    <text x="262" y="146" font-size="9" fill="#37474f">after   data=42 ready=1</text>
    <text x="262" y="162" font-size="9" fill="#1b5e20">held exclusive</text>

    <line x1="336" y1="168" x2="336" y2="184" stroke="#37474f" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="250" y="186" width="172" height="86" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="336" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#1b5e20">L2 cache</text>
    <text x="336" y="220" text-anchor="middle" font-size="9" fill="#2e7d32">private</text>
    <text x="262" y="240" font-size="9" fill="#546e7a">before  data=0 ready=0</text>
    <text x="262" y="258" font-size="9" fill="#37474f">after   data=42 ready=1</text>

    <!-- core 1 -->
    <rect x="520" y="40" width="400" height="248" rx="4" fill="#fafafa" stroke="#b0b0b0"/>
    <text x="720" y="60" text-anchor="middle" font-size="11" font-weight="700" fill="#546e7a">core 1</text>

    <rect x="540" y="72" width="160" height="200" fill="#ffffff" stroke="#b0b0b0"/>
    <text x="620" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#546e7a">store buffer</text>
    <text x="620" y="106" text-anchor="middle" font-size="9" fill="#78909c">private to this core</text>
    <text x="552" y="130" font-size="9" font-weight="700" fill="#546e7a">before lock</text>
    <rect x="552" y="136" width="136" height="18" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="620" y="149" text-anchor="middle" font-size="9" fill="#78909c">empty</text>
    <text x="552" y="176" font-size="9" font-weight="700" fill="#546e7a">after lock</text>
    <rect x="552" y="182" width="136" height="18" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="620" y="195" text-anchor="middle" font-size="9" fill="#78909c">empty</text>
    <text x="620" y="246" text-anchor="middle" font-size="9" fill="#78909c">reads only its own stores</text>

    <line x1="700" y1="130" x2="728" y2="130" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="730" y="72" width="172" height="96" fill="#ffffff" stroke="#b0b0b0"/>
    <text x="816" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#546e7a">L1 cache</text>
    <text x="816" y="106" text-anchor="middle" font-size="9" fill="#78909c">private</text>
    <text x="742" y="128" font-size="9" fill="#78909c">before  data=0 ready=0</text>
    <text x="742" y="146" font-size="9" fill="#c62828">after   invalidated</text>
    <text x="742" y="162" font-size="9" fill="#c62828">refetches from L3</text>

    <line x1="816" y1="168" x2="816" y2="184" stroke="#b0b0b0" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="730" y="186" width="172" height="86" fill="#ffffff" stroke="#b0b0b0"/>
    <text x="816" y="204" text-anchor="middle" font-size="10" font-weight="700" fill="#546e7a">L2 cache</text>
    <text x="816" y="220" text-anchor="middle" font-size="9" fill="#78909c">private</text>
    <text x="742" y="240" font-size="9" fill="#78909c">before  data=0 ready=0</text>
    <text x="742" y="258" font-size="9" fill="#c62828">after   invalidated</text>

    <!-- links to L3 -->
    <line x1="336" y1="272" x2="336" y2="324" stroke="#2e7d32" stroke-width="1.5" marker-end="url(#ag)"/>
    <line x1="816" y1="272" x2="816" y2="324" stroke="#2e7d32" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ag)"/>

    <!-- L3 -->
    <rect x="40" y="326" width="880" height="78" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2"/>
    <text x="480" y="346" text-anchor="middle" font-size="11" font-weight="700" fill="#e65100">L3 cache, shared by every core on the socket: the coherency point</text>
    <text x="480" y="366" text-anchor="middle" font-size="9" fill="#8d4004">before  data = 0, ready = 0. Neither store has left a store buffer, so core 1 cannot see them</text>
    <text x="480" y="384" text-anchor="middle" font-size="9" fill="#8d4004">after lock  data = 42, ready = 1. Both stores arrived in program order, and core 1's copies were invalidated</text>

    <line x1="480" y1="404" x2="480" y2="424" stroke="#37474f" stroke-width="1.5" marker-end="url(#ar)"/>

    <!-- memory -->
    <rect x="40" y="426" width="880" height="38" rx="4" fill="#eceff1" stroke="#90a4ae"/>
    <text x="480" y="450" text-anchor="middle" font-size="10" fill="#546e7a">main memory. A store reaches it only when the line is evicted; the coherency point is L3, above it</text>

    <text x="40" y="486" font-size="9" fill="#546e7a">A core reads its own store buffer, so it sees its stores at once. No other core can read that buffer, so the stores stay invisible until they reach L3.</text>
  </g>
</svg>
