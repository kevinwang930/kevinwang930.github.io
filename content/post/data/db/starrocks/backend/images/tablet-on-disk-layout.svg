<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="100%" role="img" aria-label="Example sales table mapped to BE tablet on-disk layout">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#455a64"/>
    </marker>
  </defs>
  <rect width="1100" height="620" fill="#f7f9fb"/>
  <text x="550" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">From SQL table to on-disk Segment files</text>
  <text x="550" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Example: sales, 2 buckets = 2 tablets; one replica on BE under storage_root</text>

  <!-- SQL -->
  <rect x="24" y="68" width="340" height="250" fill="#ffffff" stroke="#1565c0" stroke-width="1.5" rx="6"/>
  <rect x="24" y="68" width="340" height="28" fill="#1565c0" rx="6"/>
  <text x="194" y="87" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">1. SQL table</text>
  <text x="40" y="112" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">CREATE TABLE sales (</text>
  <text x="40" y="130" font-family="Consolas, monospace" font-size="11" fill="#37474f">  dt DATE,</text>
  <text x="40" y="148" font-family="Consolas, monospace" font-size="11" fill="#37474f">  region VARCHAR(32),</text>
  <text x="40" y="166" font-family="Consolas, monospace" font-size="11" fill="#37474f">  amount BIGINT</text>
  <text x="40" y="184" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">)</text>
  <text x="40" y="202" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">DUPLICATE KEY(dt, region)</text>
  <text x="40" y="220" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">DISTRIBUTED BY HASH(region)</text>
  <text x="40" y="238" font-family="Consolas, monospace" font-size="11" fill="#0d47a1">BUCKETS 2;</text>
  <text x="40" y="268" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">Sort key = short-key source</text>
  <text x="40" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">2 buckets =&gt; 2 LocalTablet ids</text>

  <!-- FE tablets -->
  <rect x="400" y="68" width="280" height="250" fill="#ffffff" stroke="#6a1b9a" stroke-width="1.5" rx="6"/>
  <rect x="400" y="68" width="280" height="28" fill="#6a1b9a" rx="6"/>
  <text x="540" y="87" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">2. FE placement</text>
  <rect x="420" y="112" width="240" height="70" fill="#f3e5f5" stroke="#8e24aa" rx="4"/>
  <text x="540" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#4a148c">LocalTablet 100</text>
  <text x="540" y="158" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7b1fa2">Replica on BE-1</text>
  <text x="540" y="174" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7b1fa2">shard_id=1  schema_hash=1420...</text>
  <rect x="420" y="200" width="240" height="70" fill="#f3e5f5" stroke="#8e24aa" rx="4"/>
  <text x="540" y="226" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#4a148c">LocalTablet 101</text>
  <text x="540" y="246" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#7b1fa2">Replica on BE-2 (same shape)</text>
  <text x="540" y="292" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">Hash(region) picks tablet</text>

  <!-- arrows SQL to FE -->
  <path d="M 364 180 L 396 180" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- BE disk -->
  <rect x="720" y="68" width="360" height="520" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
  <rect x="720" y="68" width="360" height="28" fill="#2e7d32" rx="6"/>
  <text x="900" y="87" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">3. BE-1 disk (tablet 100)</text>

  <text x="740" y="118" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1b5e20">storage_root/</text>
  <rect x="740" y="128" width="320" height="52" fill="#fff8e1" stroke="#f9a825" rx="4"/>
  <text x="756" y="150" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#e65100">meta/   (RocksDB KVStore)</text>
  <text x="756" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#ef6c00">tablet / rowset / txn meta  (not rows)</text>

  <rect x="740" y="196" width="320" height="360" fill="#e8f5e9" stroke="#43a047" rx="4"/>
  <text x="756" y="220" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1b5e20">data/1/100/1420156061/</text>
  <text x="756" y="238" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#2e7d32">shard / tablet_id / schema_hash</text>

  <rect x="756" y="252" width="288" height="88" fill="#ffffff" stroke="#1565c0" rx="3"/>
  <text x="772" y="274" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0d47a1">Rowset rs020a  (version 3-3)</text>
  <text x="772" y="294" font-family="Consolas, monospace" font-size="11" fill="#1565c0">rs020a_0.dat   Segment 0</text>
  <text x="772" y="312" font-family="Consolas, monospace" font-size="11" fill="#1565c0">rs020a_1.dat   Segment 1</text>
  <text x="772" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#607d8b">column pages + footer indexes</text>

  <rect x="756" y="352" width="288" height="72" fill="#ffffff" stroke="#6a1b9a" rx="3"/>
  <text x="772" y="374" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#4a148c">Rowset rs031b  (version 4-4)</text>
  <text x="772" y="394" font-family="Consolas, monospace" font-size="11" fill="#7b1fa2">rs031b_0.dat   Segment 0</text>
  <text x="772" y="412" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#607d8b">one more published load</text>

  <rect x="756" y="438" width="288" height="100" fill="#eceff1" stroke="#78909c" rx="3"/>
  <text x="772" y="460" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#455a64">Optional sidecars (same prefix)</text>
  <text x="772" y="480" font-family="Consolas, monospace" font-size="10" fill="#546e7a">rs020a_0.del   .upt   .cols</text>
  <text x="772" y="498" font-family="Consolas, monospace" font-size="10" fill="#546e7a">rs020a_0_{idx}.ivt/   .vi</text>
  <text x="772" y="520" font-family="Consolas, monospace" font-size="10" fill="#546e7a">index.l0.*  (PK PersistentIndex)</text>

  <!-- arrow FE tablet 100 to BE -->
  <path d="M 680 147 L 716 147" stroke="#455a64" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="698" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#455a64">replica</text>

  <!-- bottom legend left -->
  <rect x="24" y="340" width="656" height="248" fill="#ffffff" stroke="#455a64" stroke-width="1.5" rx="6"/>
  <rect x="24" y="340" width="656" height="28" fill="#455a64" rx="6"/>
  <text x="352" y="359" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Mapping</text>

  <text x="44" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#263238">
    <tspan font-weight="700">Table sales</tspan>  --&gt;  many tablets (here 100, 101)
  </text>
  <text x="44" y="424" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#263238">
    <tspan font-weight="700">Tablet 100</tspan>  --&gt;  dir data/{shard}/{tablet_id}/{schema_hash}/
  </text>
  <text x="44" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#263238">
    <tspan font-weight="700">Rowset</tspan>  --&gt;  one published version unit (meta in RocksDB + N segment files)
  </text>
  <text x="44" y="480" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#263238">
    <tspan font-weight="700">Segment</tspan>  --&gt;  {rowset_id}_{seg}.dat  (no segment/ directory)
  </text>
  <text x="44" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">Scan opens Tablet at a version, captures rowsets, then SegmentIterator per .dat</text>
  <text x="44" y="544" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">User rows are only in .dat; meta/ holds identity and version graph</text>
  <text x="44" y="568" font-family="Consolas, monospace" font-size="10" fill="#78909c">INSERT INTO sales ...  =&gt; new rowset + segment .dat, then PUBLISH_VERSION</text>
</svg>
