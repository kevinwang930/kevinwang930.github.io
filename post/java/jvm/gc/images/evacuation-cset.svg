<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Young or mixed evacuation: build collection set, copy live objects, free empty regions">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#37474f"/>
    </marker>
  </defs>
  <rect width="900" height="420" fill="#f7f9fb"/>
  <text x="450" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#263238">Evacuation and collection set</text>
  <text x="450" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#78909c">STW pause phases aligned with the G1 Tuning Guide garbage collection process</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="70" width="160" height="56" rx="6" fill="#eceff1" stroke="#607d8b"/>
    <text x="120" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">Mutator</text>
    <text x="120" y="112" text-anchor="middle" font-size="11" fill="#546e7a">Eden fills</text>

    <line x1="200" y1="98" x2="248" y2="98" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="254" y="70" width="180" height="56" rx="6" fill="#fff8e1" stroke="#f9a825"/>
    <text x="344" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#e65100">Safepoint</text>
    <text x="344" y="112" text-anchor="middle" font-size="11" fill="#ef6c00">young / mixed pause</text>

    <line x1="434" y1="98" x2="482" y2="98" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="488" y="70" width="180" height="56" rx="6" fill="#e3f2fd" stroke="#1565c0"/>
    <text x="578" y="94" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">G1Policy</text>
    <text x="578" y="112" text-anchor="middle" font-size="11" fill="#1565c0">predict, build CSet</text>

    <line x1="578" y1="126" x2="578" y2="168" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- CSet box -->
    <rect x="40" y="174" width="820" height="100" rx="8" fill="#ffffff" stroke="#90a4ae"/>
    <text x="56" y="198" font-size="13" font-weight="700" fill="#37474f">Collection set</text>

    <rect x="56" y="214" width="100" height="40" rx="4" fill="#ef5350" stroke="#c62828"/>
    <text x="106" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Eden</text>
    <rect x="168" y="214" width="100" height="40" rx="4" fill="#e53935" stroke="#b71c1c"/>
    <text x="218" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">Survivor</text>
    <rect x="280" y="214" width="140" height="40" rx="4" fill="#90caf9" stroke="#1565c0" stroke-dasharray="4 2"/>
    <text x="350" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#0d47a1">Old candidates</text>
    <text x="350" y="246" text-anchor="middle" font-size="10" fill="#1565c0">mixed only</text>

    <text x="460" y="238" font-size="12" fill="#546e7a">Young-only: Eden + Survivor. Mixed: + budgeted old regions.</text>

    <line x1="450" y1="274" x2="450" y2="300" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="40" y="306" width="250" height="52" rx="6" fill="#bbdefb" stroke="#1565c0"/>
    <text x="165" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#0d47a1">Evacuate CSet</text>
    <text x="165" y="346" text-anchor="middle" font-size="11" fill="#1565c0">copy live to free regions</text>

    <line x1="290" y1="332" x2="338" y2="332" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="344" y="306" width="250" height="52" rx="6" fill="#e8f5e9" stroke="#2e7d32"/>
    <text x="469" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1b5e20">Free empty regions</text>
    <text x="469" y="346" text-anchor="middle" font-size="11" fill="#2e7d32">return to free list</text>

    <line x1="594" y1="332" x2="642" y2="332" stroke="#37474f" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="648" y="306" width="212" height="52" rx="6" fill="#eceff1" stroke="#607d8b"/>
    <text x="754" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#37474f">Resume mutator</text>
    <text x="754" y="346" text-anchor="middle" font-size="11" fill="#546e7a">post-evacuate cleanup</text>

    <text x="450" y="396" text-anchor="middle" font-size="11" fill="#78909c">Evacuation failure keeps objects in place; sustained pressure may escalate to Full GC</text>
  </g>
</svg>
