<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-label="Orders-per-minute. ResourceManager and JobMaster join PekkoRpcService. Pekko client connects to the other process Pekko server. That server then reaches TaskExecutor. Shuffle records leave the producer's NettyServer and arrive at the consumer's NettyClient.">
  <defs>
    <marker id="rpc" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="data" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    <marker id="local" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="hand" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="920" rx="12" fill="#ffffff" stroke="#e2e8f0"/>

  <rect x="16" y="12" width="1248" height="200" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="36" y="34" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1e3a8a">JobManager</text>

  <rect x="36" y="46" width="220" height="56" rx="6" fill="#ffffff" stroke="#93c5fd"/>
  <text x="146" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">Dispatcher</text>
  <text x="146" y="88" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">REST</text>

  <rect x="300" y="46" width="280" height="56" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="440" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">ResourceManager</text>
  <rect x="700" y="46" width="280" height="56" rx="6" fill="#ffffff" stroke="#2563eb"/>
  <text x="840" y="78" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">JobMaster</text>

  <text x="40" y="168" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">PekkoRpcService</text>
  <rect x="280" y="128" width="720" height="68" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="300" y="140" width="320" height="44" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="460" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a">Pekko server</text>
  <rect x="660" y="140" width="320" height="44" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="820" y="167" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1e3a8a">Pekko client</text>

  <rect x="16" y="340" width="560" height="556" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="32" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">TaskManager</text>
  <rect x="32" y="374" width="528" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="44" y="386" width="240" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="164" y="411" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">Pekko server</text>
  <rect x="304" y="386" width="240" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="424" y="411" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">Pekko client</text>
  <rect x="32" y="462" width="528" height="40" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="296" y="487" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">TaskExecutor</text>

  <rect x="32" y="518" width="270" height="358" rx="6" fill="#e4eaf4" stroke="#94a3b8"/>
  <text x="167" y="542" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Slot 0</text>
  <rect x="46" y="556" width="242" height="120" rx="8" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="167" y="604" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">A.0</text>
  <text x="167" y="628" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">orders -&gt; ParseOrder</text>
  <rect x="46" y="724" width="242" height="120" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="167" y="772" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">B.0</text>
  <text x="167" y="796" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">window -&gt; kafkaSink</text>

  <rect x="328" y="556" width="232" height="120" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="444" y="622" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#065f46">NettyServer</text>
  <rect x="328" y="724" width="232" height="120" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="444" y="790" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a3412">NettyClient</text>

  <rect x="704" y="340" width="560" height="556" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="720" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9a3412">TaskManager</text>
  <rect x="720" y="374" width="528" height="64" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <rect x="732" y="386" width="240" height="40" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="852" y="411" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">Pekko server</text>
  <rect x="992" y="386" width="240" height="40" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1112" y="411" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#1e3a8a">Pekko client</text>
  <rect x="720" y="462" width="528" height="40" rx="6" fill="#ffffff" stroke="#c2410c"/>
  <text x="984" y="487" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#0f172a">TaskExecutor</text>

  <rect x="720" y="556" width="232" height="120" rx="6" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/>
  <text x="836" y="622" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#065f46">NettyServer</text>
  <rect x="720" y="724" width="232" height="120" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.8"/>
  <text x="836" y="790" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#9a3412">NettyClient</text>

  <rect x="980" y="518" width="268" height="358" rx="6" fill="#e4eaf4" stroke="#94a3b8"/>
  <text x="1114" y="542" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#334155">Slot 1</text>
  <rect x="994" y="556" width="240" height="120" rx="8" fill="#f3e8ff" stroke="#7c3aed"/>
  <text x="1114" y="604" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">A.1</text>
  <text x="1114" y="628" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">orders -&gt; ParseOrder</text>
  <rect x="994" y="724" width="240" height="120" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="1114" y="772" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">B.1</text>
  <text x="1114" y="796" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">window -&gt; kafkaSink</text>

  <!-- endpoints into PekkoRpcService, then Pekko into TaskExecutor -->
  <polyline points="440,102 440,116 840,116" fill="none" stroke="#64748b" stroke-width="2"/>
  <line x1="640" y1="116" x2="640" y2="128" stroke="#64748b" stroke-width="2" marker-end="url(#hand)"/>
  <line x1="296" y1="438" x2="296" y2="462" stroke="#64748b" stroke-width="2" marker-end="url(#hand)"/>
  <line x1="984" y1="438" x2="984" y2="462" stroke="#64748b" stroke-width="2" marker-end="url(#hand)"/>

  <!-- Pekko client to the other Pekko server -->
  <line x1="820" y1="184" x2="820" y2="250" stroke="#ffffff" stroke-width="6"/>
  <line x1="820" y1="184" x2="820" y2="250" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="820,250 164,250 164,386" fill="none" stroke="#ffffff" stroke-width="6"/>
  <polyline points="820,250 164,250 164,386" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#rpc)"/>
  <polyline points="820,250 852,250 852,386" fill="none" stroke="#ffffff" stroke-width="6"/>
  <polyline points="820,250 852,250 852,386" fill="none" stroke="#2563eb" stroke-width="2.5" marker-end="url(#rpc)"/>

  <polyline points="424,386 424,310 460,310" fill="none" stroke="#ffffff" stroke-width="6"/>
  <polyline points="424,386 424,310 460,310" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <polyline points="1112,386 1112,310 460,310" fill="none" stroke="#ffffff" stroke-width="6"/>
  <polyline points="1112,386 1112,310 460,310" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="460" y1="310" x2="460" y2="184" stroke="#ffffff" stroke-width="6"/>
  <line x1="460" y1="310" x2="460" y2="184" stroke="#2563eb" stroke-width="2.5" marker-end="url(#rpc)"/>

  <!-- same index, inside the slot -->
  <line x1="167" y1="676" x2="167" y2="716" stroke="#ffffff" stroke-width="6"/>
  <line x1="167" y1="676" x2="167" y2="716" stroke="#059669" stroke-width="2.5" marker-end="url(#local)"/>
  <line x1="1114" y1="676" x2="1114" y2="716" stroke="#ffffff" stroke-width="6"/>
  <line x1="1114" y1="676" x2="1114" y2="716" stroke="#059669" stroke-width="2.5" marker-end="url(#local)"/>

  <!-- A writes into the local NettyServer. The consumer's NettyClient delivers to B. -->
  <line x1="288" y1="616" x2="328" y2="616" stroke="#ffffff" stroke-width="6"/>
  <line x1="288" y1="616" x2="328" y2="616" stroke="#ea580c" stroke-width="2.5" marker-end="url(#data)"/>
  <line x1="328" y1="784" x2="288" y2="784" stroke="#ffffff" stroke-width="6"/>
  <line x1="328" y1="784" x2="288" y2="784" stroke="#ea580c" stroke-width="2.5" marker-end="url(#data)"/>
  <line x1="994" y1="616" x2="952" y2="616" stroke="#ffffff" stroke-width="6"/>
  <line x1="994" y1="616" x2="952" y2="616" stroke="#ea580c" stroke-width="2.5" marker-end="url(#data)"/>
  <line x1="952" y1="784" x2="994" y2="784" stroke="#ffffff" stroke-width="6"/>
  <line x1="952" y1="784" x2="994" y2="784" stroke="#ea580c" stroke-width="2.5" marker-end="url(#data)"/>

  <!-- A.0 to B.1, and A.1 to B.0, each in its own lane between the TaskManagers -->
  <polyline points="560,616 616,616 616,748 720,748" fill="none" stroke="#ffffff" stroke-width="6"/>
  <polyline points="560,616 616,616 616,748 720,748" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#data)"/>
  <polyline points="720,616 676,616 676,800 560,800" fill="none" stroke="#ffffff" stroke-width="6"/>
  <polyline points="720,616 676,616 676,800 560,800" fill="none" stroke="#ea580c" stroke-width="2.5" marker-end="url(#data)"/>
</svg>
