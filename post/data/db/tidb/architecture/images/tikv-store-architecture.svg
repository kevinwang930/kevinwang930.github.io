<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-label="TiKV store process architecture">
  <defs>
    <marker id="arrT" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect width="1100" height="720" fill="#f7f9fb"/>
  <text x="550" y="26" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">One TiKV store process (not RocksDB alone)</text>
  <text x="550" y="46" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">TiDB is a SQL + 2PC client. TiKV owns gRPC, scheduling, Raft per Region, MVCC apply, and two RocksDB engines.</text>

  <!-- External -->
  <g transform="translate(40, 70)">
    <rect width="160" height="70" fill="#e3f2fd" stroke="#1565c0" rx="5"/>
    <text x="80" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0d47a1">TiDB client-go</text>
    <text x="80" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#1565c0">kvrpcpb</text>
  </g>
  <g transform="translate(40, 160)">
    <rect width="160" height="70" fill="#fff8e1" stroke="#f9a825" rx="5"/>
    <text x="80" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#e65100">PD</text>
    <text x="80" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#f57f17">heartbeat / schedule</text>
  </g>
  <g transform="translate(40, 250)">
    <rect width="160" height="70" fill="#e8f5e9" stroke="#2e7d32" rx="5"/>
    <text x="80" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1b5e20">Other TiKV</text>
    <text x="80" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#2e7d32">Raft messages</text>
  </g>

  <line x1="200" y1="105" x2="248" y2="105" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrT)"/>
  <line x1="200" y1="195" x2="248" y2="195" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrT)"/>
  <line x1="200" y1="285" x2="248" y2="340" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrT)"/>

  <!-- TiKV box -->
  <g transform="translate(250, 70)">
    <rect width="810" height="520" fill="#ffffff" stroke="#2e7d32" stroke-width="2" rx="6"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1b5e20">TiKV store</text>

    <!-- gRPC -->
    <rect x="20" y="48" width="770" height="56" fill="#e8f5e9" stroke="#66bb6a" rx="4"/>
    <text x="405" y="72" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">gRPC server (KvService)</text>
    <text x="405" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">Get / Scan / Prewrite / Commit / Coprocessor / CheckTxnStatus / ...</text>

    <!-- Scheduler -->
    <rect x="20" y="120" width="370" height="80" fill="#fff3e0" stroke="#ffb74d" rx="4"/>
    <text x="205" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">Scheduler + latches</text>
    <text x="205" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6d4c41">per-key latch; conflict detect before propose</text>
    <text x="205" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#8d6e63">read path may bypass propose</text>

    <!-- Worker -->
    <rect x="410" y="120" width="380" height="80" fill="#e3f2fd" stroke="#64b5f6" rx="4"/>
    <text x="600" y="148" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">Storage / txn worker</text>
    <text x="600" y="172" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#1565c0">build Raft commands for leader Regions</text>
    <text x="600" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#546e7a">not-leader =&gt; redirect client</text>

    <!-- Raftstore -->
    <rect x="20" y="220" width="770" height="130" fill="#f3e5f5" stroke="#ab47bc" rx="4"/>
    <text x="405" y="244" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6a1b9a">raftstore (many Raft groups on this store)</text>

    <rect x="40" y="260" width="220" height="70" fill="#ffffff" stroke="#ce93d8" rx="3"/>
    <text x="150" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6a1b9a">Peer Region R1</text>
    <text x="150" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7b1fa2">LEADER or FOLLOWER</text>

    <rect x="280" y="260" width="220" height="70" fill="#ffffff" stroke="#ce93d8" rx="3"/>
    <text x="390" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6a1b9a">Peer Region R2</text>
    <text x="390" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7b1fa2">LEADER or FOLLOWER</text>

    <rect x="520" y="260" width="240" height="70" fill="#ffffff" stroke="#ce93d8" rx="3"/>
    <text x="640" y="286" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6a1b9a">Peer Region ...</text>
    <text x="640" y="306" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="9" fill="#7b1fa2">propose / append / apply</text>

    <!-- Apply / MVCC -->
    <rect x="20" y="370" width="770" height="56" fill="#e8f5e9" stroke="#66bb6a" rx="4"/>
    <text x="405" y="394" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">Apply + MVCC (Percolator on applied cmds)</text>
    <text x="405" y="414" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">Lock / Write / Default semantics after Raft majority commit</text>

    <!-- RocksDB -->
    <rect x="20" y="446" width="370" height="54" fill="#eceff1" stroke="#78909c" rx="4"/>
    <text x="205" y="468" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#37474f">kvdb (RocksDB)</text>
    <text x="205" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#546e7a">lock / write / default (+ raft meta CF)</text>

    <rect x="410" y="446" width="380" height="54" fill="#eceff1" stroke="#78909c" rx="4"/>
    <text x="600" y="468" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#37474f">raftdb (RocksDB)</text>
    <text x="600" y="488" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#546e7a">Raft logs per peer</text>
  </g>

  <!-- Bottom note -->
  <g transform="translate(40, 610)">
    <rect width="1020" height="90" fill="#ffffff" stroke="#455a64" stroke-width="1.2" rx="5"/>
    <text x="20" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#263238">Division of labor</text>
    <text x="20" y="52" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">TiDB: SQL, membuffer, choose primaryKey, drive Prewrite/Commit RPCs, RegionCache. Does not open RocksDB.</text>
    <text x="20" y="74" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#37474f">TiKV: durable Multi-Raft + MVCC + RocksDB. A single RocksDB has no cross-Region atomicity; primaryKey 2PC + Raft supply that.</text>
  </g>
</svg>
