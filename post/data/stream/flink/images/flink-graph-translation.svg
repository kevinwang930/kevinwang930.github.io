  <text x="900" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">list on env</text>

  <!-- transition 1 -> 2 -->
  <line x1="470" y1="116" x2="470" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="496" y="120" width="160" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="576" y="135" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#475569">StreamGraphGenerator</text>

