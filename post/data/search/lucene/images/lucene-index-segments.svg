<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460" viewBox="0 0 920 460" role="img" aria-label="Lucene index: Directory, segments, codec structures">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <style type="text/css"><![CDATA[
    text { font-family: system-ui, sans-serif; }
    .t { font-size: 14px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 10px; fill: #64748b; }
    .m { font-family: ui-monospace, Menlo, monospace; font-size: 10px; fill: #334155; }
    .h { font-size: 12px; font-weight: 700; fill: #0f172a; }
    .lt { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.25; }
    .dir { fill: #f8fafc; stroke: #64748b; stroke-width: 1.5; }
    .seg { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; }
    .codec { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.25; }
  ]]></style>

  <rect width="920" height="460" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="28" y="28" class="t">Lucene index on disk</text>
  <text x="28" y="46" class="s">Directory holds segments_N plus immutable segment files. Deletes live in a bitset (live docs), not rewritten postings.</text>

  <rect x="24" y="62" width="872" height="56" rx="8" class="dir" filter="url(#sh)"/>
  <text x="40" y="86" class="h">Directory (FSDirectory / MMapDirectory / ...)</text>
  <text x="40" y="104" class="m">segments_N  -&gt; SegmentInfos  |  per-segment files (.si, postings, points, DV, stored, .liv, ...)</text>

  <line x1="160" y1="118" x2="160" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="460" y1="118" x2="460" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="760" y1="118" x2="760" y2="140" stroke="#64748b" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="24" y="140" width="280" height="100" rx="8" class="seg" filter="url(#sh)"/>
  <text x="40" y="164" class="lt" fill="#2563eb">Segment _0</text>
  <text x="40" y="186" class="m">SegmentCommitInfo</text>
  <text x="40" y="204" class="m">maxDoc | delGen | codec</text>
  <text x="40" y="222" class="m">SegmentReader (LeafReader)</text>

  <rect x="320" y="140" width="280" height="100" rx="8" class="seg" filter="url(#sh)"/>
  <text x="336" y="164" class="lt" fill="#2563eb">Segment _1</text>
  <text x="336" y="186" class="m">SegmentCommitInfo</text>
  <text x="336" y="204" class="m">maxDoc | delGen | codec</text>
  <text x="336" y="222" class="m">SegmentReader (LeafReader)</text>

  <rect x="616" y="140" width="280" height="100" rx="8" class="seg" filter="url(#sh)"/>
  <text x="632" y="164" class="lt" fill="#2563eb">Segment _N</text>
  <text x="632" y="186" class="m">...</text>
  <text x="632" y="204" class="m">merged over time</text>
  <text x="632" y="222" class="m">by MergePolicy</text>

  <text x="28" y="270" class="lt" fill="#059669">One segment (codec producers)</text>

  <rect x="24" y="282" width="140" height="64" rx="6" class="codec"/>
  <text x="36" y="308" class="h">Terms + postings</text>
  <text x="36" y="326" class="m">TermsEnum</text>

  <rect x="176" y="282" width="140" height="64" rx="6" class="codec"/>
  <text x="188" y="308" class="h">Points (BKD)</text>
  <text x="188" y="326" class="m">PointValues</text>

  <rect x="328" y="282" width="140" height="64" rx="6" class="codec"/>
  <text x="340" y="308" class="h">Doc values</text>
  <text x="340" y="326" class="m">columnar</text>

  <rect x="480" y="282" width="140" height="64" rx="6" class="codec"/>
  <text x="492" y="308" class="h">Stored fields</text>
  <text x="492" y="326" class="m">_source-like</text>

  <rect x="632" y="282" width="128" height="64" rx="6" class="codec"/>
  <text x="644" y="308" class="h">Norms</text>
  <text x="644" y="326" class="m">length / boost</text>

  <rect x="772" y="282" width="124" height="64" rx="6" class="codec"/>
  <text x="784" y="308" class="h">Live docs</text>
  <text x="784" y="326" class="m">Bits / .liv</text>

  <rect x="24" y="368" width="872" height="72" rx="8" class="box"/>
  <text x="40" y="392" class="h">Write / read</text>
  <text x="40" y="412" class="m">IndexWriter -&gt; DocumentsWriterPerThread -&gt; IndexingChain.flush -&gt; new segment</text>
  <text x="40" y="428" class="m">DirectoryReader -&gt; StandardDirectoryReader -&gt; LeafReaderContext[] for IndexSearcher</text>
</svg>
