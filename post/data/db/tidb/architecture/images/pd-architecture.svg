<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="PD control plane: TSO, Region meta, heartbeats, schedule">
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1565c0"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#ef6c00"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#2e7d32"/>
    </marker>
  </defs>

  <rect width="1100" height="580" fill="#f7f9fb"/>
  <text x="550" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">PD control plane (git/pd)</text>
  <text x="550" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Leader serves TSO and Region meta; TiKV heartbeats drive schedule operators</text>

  <!-- Clients -->
  <g transform="translate(40, 80)">
    <rect width="160" height="90" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="6"/>
    <text x="80" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0d47a1">TiDB</text>
    <text x="80" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1565c0">Tso stream</text>
    <text x="80" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1565c0">GetRegion</text>
  </g>

  <g transform="translate(40, 200)">
    <rect width="160" height="90" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
    <text x="80" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">TiKV</text>
    <text x="80" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">StoreHeartbeat</text>
    <text x="80" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#2e7d32">RegionHeartbeat</text>
  </g>

  <!-- PD box -->
  <g transform="translate(280, 70)">
    <rect width="780" height="480" fill="#fff8e1" stroke="#f9a825" stroke-width="1.8" rx="8"/>
    <text x="390" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e65100">PD leader (GrpcServer + RaftCluster)</text>
  </g>

  <!-- TSO -->
  <g transform="translate(310, 120)">
    <rect width="220" height="120" fill="#ffffff" stroke="#ef6c00" stroke-width="1.4" rx="5"/>
    <text x="110" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">TSO</text>
    <text x="110" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">Allocator.GenerateTSO</text>
    <text x="110" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">physical + logical</text>
    <text x="110" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">startTS / commitTS</text>
  </g>

  <!-- Region meta -->
  <g transform="translate(560, 120)">
    <rect width="220" height="120" fill="#ffffff" stroke="#ef6c00" stroke-width="1.4" rx="5"/>
    <text x="110" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#e65100">Region meta</text>
    <text x="110" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">RegionsInfo</text>
    <text x="110" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">regionTree.search(key)</text>
    <text x="110" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">Region + Leader</text>
  </g>

  <!-- Leader election -->
  <g transform="translate(810, 120)">
    <rect width="220" height="120" fill="#ffffff" stroke="#8e24aa" stroke-width="1.4" rx="5"/>
    <text x="110" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#6a1b9a">Leader election</text>
    <text x="110" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">leaderLoop</text>
    <text x="110" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#37474f">Campaign etcd lease</text>
    <text x="110" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">one PD serves TSO</text>
  </g>

  <!-- Heartbeat / schedule -->
  <g transform="translate(310, 280)">
    <rect width="470" height="140" fill="#ffffff" stroke="#2e7d32" stroke-width="1.4" rx="5"/>
    <text x="235" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1b5e20">Heartbeats and schedule</text>
    <text x="40" y="58" font-family="Consolas, monospace" font-size="11" fill="#37474f">HandleRegionHeartbeat</text>
    <text x="40" y="80" font-family="Consolas, monospace" font-size="11" fill="#37474f">processRegionHeartbeat (update regionTree)</text>
    <text x="40" y="102" font-family="Consolas, monospace" font-size="11" fill="#37474f">OperatorController.Dispatch</text>
    <text x="40" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">TransferLeader / Split / Merge via hbStreams</text>
  </g>

  <g transform="translate(810, 280)">
    <rect width="220" height="140" fill="#ffffff" stroke="#546e7a" stroke-width="1.4" rx="5"/>
    <text x="110" y="36" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#37474f">Schedulers</text>
    <text x="110" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">balance_leader</text>
    <text x="110" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">balance_region</text>
    <text x="110" y="106" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">hot_region / ...</text>
    <text x="110" y="128" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#78909c">create Operators</text>
  </g>

  <!-- etcd -->
  <g transform="translate(310, 450)">
    <rect width="720" height="70" fill="#eceff1" stroke="#607d8b" stroke-width="1.2" rx="5"/>
    <text x="360" y="30" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#455a64">embedded etcd</text>
    <text x="360" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#546e7a">membership / PD leader key / TSO window persistence</text>
  </g>

  <!-- arrows -->
  <line x1="200" y1="120" x2="310" y2="160" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="200" y1="145" x2="560" y2="160" stroke="#1565c0" stroke-width="1.6" marker-end="url(#arrB)"/>
  <line x1="200" y1="240" x2="310" y2="320" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arrG)"/>
</svg>
