<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" role="img" aria-label="Inside one Segment .dat file: per-column data pages and footer indexes">
  <rect width="960" height="560" fill="#f7f9fb"/>
  <text x="480" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#263238">Segment columnar layout (one .dat)</text>
  <text x="480" y="48" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Example: sales columns dt, region, amount in rs020a_0.dat</text>

  <!-- file shell -->
  <rect x="40" y="68" width="880" height="440" fill="#ffffff" stroke="#2e7d32" stroke-width="2" rx="8"/>
  <rect x="40" y="68" width="880" height="32" fill="#2e7d32" rx="8"/>
  <text x="480" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#ffffff">rs020a_0.dat</text>

  <text x="60" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#37474f">SegmentWriter::append_chunk writes each column via its ColumnWriter</text>

  <!-- column dt -->
  <rect x="60" y="148" width="260" height="200" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" rx="6"/>
  <rect x="60" y="148" width="260" height="28" fill="#1565c0" rx="6"/>
  <text x="190" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">column dt</text>
  <rect x="76" y="190" width="228" height="36" fill="#ffffff" stroke="#90caf9" rx="3"/>
  <text x="190" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d47a1">data page 0</text>
  <rect x="76" y="236" width="228" height="36" fill="#ffffff" stroke="#90caf9" rx="3"/>
  <text x="190" y="259" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#0d47a1">data page 1</text>
  <text x="190" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">+ ordinal / zone map</text>
  <text x="190" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">(+ bitmap/bloom if any)</text>

  <!-- column region -->
  <rect x="350" y="148" width="260" height="200" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1.5" rx="6"/>
  <rect x="350" y="148" width="260" height="28" fill="#2e7d32" rx="6"/>
  <text x="480" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">column region</text>
  <rect x="366" y="190" width="228" height="36" fill="#ffffff" stroke="#a5d6a7" rx="3"/>
  <text x="480" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1b5e20">data page 0</text>
  <rect x="366" y="236" width="228" height="36" fill="#ffffff" stroke="#a5d6a7" rx="3"/>
  <text x="480" y="259" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1b5e20">data page 1</text>
  <text x="480" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">same rowids as other cols</text>
  <text x="480" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">pages are columnar</text>

  <!-- column amount -->
  <rect x="640" y="148" width="260" height="200" fill="#fff3e0" stroke="#ef6c00" stroke-width="1.5" rx="6"/>
  <rect x="640" y="148" width="260" height="28" fill="#ef6c00" rx="6"/>
  <text x="770" y="167" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ffffff">column amount</text>
  <rect x="656" y="190" width="228" height="36" fill="#ffffff" stroke="#ffcc80" rx="3"/>
  <text x="770" y="213" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e65100">data page 0</text>
  <rect x="656" y="236" width="228" height="36" fill="#ffffff" stroke="#ffcc80" rx="3"/>
  <text x="770" y="259" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#e65100">data page 1</text>
  <text x="770" y="300" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">scan can skip this column</text>
  <text x="770" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#546e7a">if not projected</text>

  <!-- footer -->
  <rect x="60" y="368" width="840" height="120" fill="#eceff1" stroke="#546e7a" stroke-width="1.5" rx="6"/>
  <rect x="60" y="368" width="840" height="28" fill="#546e7a" rx="6"/>
  <text x="480" y="387" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Segment footer (SegmentFooterPB + size + checksum + magic)</text>
  <text x="80" y="420" font-family="Consolas, monospace" font-size="12" fill="#37474f">num_rows, per-column ColumnMetaPB (data + index page pointers)</text>
  <text x="80" y="444" font-family="Consolas, monospace" font-size="12" fill="#37474f">short_key_index_page (segment-level)</text>
  <text x="80" y="468" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#546e7a">finalize: write column data/indexes, then footer at end of file</text>

  <text x="480" y="536" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#607d8b">Optional sidecars beside the .dat: .del .upt .cols .ivt/ .vi (not inside the columnar pages)</text>
</svg>
