<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-label="Elasticsearch cluster topology roles">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b82f6"/>
    </marker>
    <marker id="arrg" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style type="text/css"><![CDATA[
    text { font-family: system-ui, sans-serif; }
    .t { font-size: 13px; font-weight: 700; fill: #0f172a; }
    .s { font-size: 10px; fill: #64748b; }
    .m { font-family: ui-monospace, monospace; font-size: 9px; fill: #475569; }
    .lt { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; }
    .cluster { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .master { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
    .data { fill: #fff; stroke: #64748b; stroke-width: 1.5; }
    .coord { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 1.5; }
    .pri { fill: #ecfdf5; stroke: #059669; stroke-width: 1.8; }
    .rep { fill: #fffbeb; stroke: #d97706; stroke-width: 1.8; }
  ]]></style>

  <rect width="900" height="500" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="36" y="30" class="t">Cluster topology characters</text>
  <text x="36" y="48" class="s">Node roles (master / data / coordinating) vs shard-copy roles (primary / replica) in DiscoveryNodes + RoutingTable</text>

  <rect x="36" y="68" width="828" height="300" rx="12" class="cluster"/>
  <text x="52" y="92" class="lt" fill="#64748b">One cluster (shared ClusterState)</text>

  <!-- Master node -->
  <rect x="56" y="112" width="200" height="220" rx="10" class="master" filter="url(#sh)"/>
  <text x="156" y="138" text-anchor="middle" class="t" style="font-size:12px">Master node</text>
  <text x="156" y="156" text-anchor="middle" class="m">role: master (elected)</text>
  <text x="156" y="178" text-anchor="middle" class="s">Controls topology</text>
  <text x="156" y="198" text-anchor="middle" class="m">MasterService</text>
  <text x="156" y="214" text-anchor="middle" class="m">Coordinator publish</text>
  <text x="156" y="230" text-anchor="middle" class="m">ClusterState updates</text>
  <text x="156" y="258" text-anchor="middle" class="s">Does not have to hold</text>
  <text x="156" y="274" text-anchor="middle" class="s">document shards</text>
  <text x="156" y="300" text-anchor="middle" class="m">masterNodeId in</text>
  <text x="156" y="316" text-anchor="middle" class="m">DiscoveryNodes</text>

  <!-- Data node A - primary -->
  <rect x="292" y="112" width="220" height="220" rx="10" class="data" filter="url(#sh)"/>
  <text x="402" y="138" text-anchor="middle" class="t" style="font-size:12px">Data node A</text>
  <text x="402" y="156" text-anchor="middle" class="m">role: data</text>

  <rect x="312" y="176" width="180" height="56" rx="6" class="pri"/>
  <text x="402" y="198" text-anchor="middle" class="t" style="font-size:11px">Primary P0</text>
  <text x="402" y="216" text-anchor="middle" class="m">ShardRouting primary</text>

  <rect x="312" y="248" width="180" height="56" rx="6" class="rep"/>
  <text x="402" y="270" text-anchor="middle" class="t" style="font-size:11px">Replica R1</text>
  <text x="402" y="288" text-anchor="middle" class="m">of shard 1 (example)</text>

  <!-- Data node B - replica -->
  <rect x="548" y="112" width="220" height="220" rx="10" class="data" filter="url(#sh)"/>
  <text x="658" y="138" text-anchor="middle" class="t" style="font-size:12px">Data node B</text>
  <text x="658" y="156" text-anchor="middle" class="m">role: data</text>

  <rect x="568" y="176" width="180" height="56" rx="6" class="rep"/>
  <text x="658" y="198" text-anchor="middle" class="t" style="font-size:11px">Replica R0</text>
  <text x="658" y="216" text-anchor="middle" class="m">copy of shard 0</text>

  <rect x="568" y="248" width="180" height="56" rx="6" class="pri"/>
  <text x="658" y="270" text-anchor="middle" class="t" style="font-size:11px">Primary P1</text>
  <text x="658" y="288" text-anchor="middle" class="m">ShardRouting primary</text>

  <!-- Coordinating node -->
  <rect x="780" y="140" width="72" height="160" rx="8" class="coord" filter="url(#sh)"/>
  <text x="816" y="190" text-anchor="middle" class="t" style="font-size:10px">Coord</text>
  <text x="816" y="208" text-anchor="middle" class="m">only</text>
  <text x="816" y="236" text-anchor="middle" class="m">HTTP</text>
  <text x="816" y="252" text-anchor="middle" class="m">forward</text>
  <text x="816" y="276" text-anchor="middle" class="m">no</text>
  <text x="816" y="290" text-anchor="middle" class="m">shards</text>

  <!-- Replication arrows between primaries and replicas -->
  <line x1="492" y1="204" x2="568" y2="204" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrg)"/>
  <text x="530" y="196" text-anchor="middle" class="m" fill="#059669">replicate</text>
  <line x1="568" y1="276" x2="492" y2="276" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrg)"/>

  <!-- Master publishes state -->
  <line x1="256" y1="200" x2="292" y2="200" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrb)"/>
  <line x1="256" y1="230" x2="292" y2="160" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="274" y="188" text-anchor="middle" class="m" fill="#2563eb">state</text>

  <!-- Legend -->
  <rect x="36" y="388" width="828" height="92" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="52" y="412" class="lt" fill="#64748b">Legend</text>

  <rect x="52" y="428" width="18" height="18" rx="3" class="master"/>
  <text x="78" y="441" class="s">Master node -- elected leader; publishes ClusterState (node role + election)</text>

  <rect x="52" y="454" width="18" height="18" rx="3" class="pri"/>
  <text x="78" y="467" class="s">Primary -- accepting write copy of a shard (ShardRouting on a data node)</text>

  <rect x="520" y="428" width="18" height="18" rx="3" class="rep"/>
  <text x="546" y="441" class="s">Replica -- in-sync copy; receives ops from primary</text>

  <rect x="520" y="454" width="18" height="18" rx="3" class="coord"/>
  <text x="546" y="467" class="s">Coordinating-only -- in DiscoveryNodes; forwards HTTP; no shards</text>
</svg>
